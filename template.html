<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미지의 CCAF 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #F7F6F2;
    --paper-deep: #EFEDE6;
    --desk: #E4E1D8;
    --ink: #26324A;
    --ink-soft: #6B7488;
    --ink-faint: #A2A8B6;
    --line: #DCDAD2;
    --grid: rgba(38, 50, 74, 0.07);
    --hl: #FFE066;
    --hl-ink: #26324A;
    --pink: #F2A9B8;
    --sage: #A7C9AE;
    --sky: #A9C4E4;
    --lavender: #C3B5E0;
    --coral: #E8907F;
    --correct: #4F8A5B;
    --wrong: #C25A48;
    --ring: #B9B6AC;
    --ring-hole: #D5D2C8;
    --note: #FFF4B8;
    --pen: #D6483A;
    --pen-blue: #2F5FA8;
    --teal: #A8DED8;
    --orange: #FFC98A;
    --card: #FFFDF7;
    --card-rule: #C9D8EA;
    --shadow: 0 18px 40px rgba(38, 50, 74, 0.14), 0 2px 6px rgba(38, 50, 74, 0.08);
    --focus: #3D6DB5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #232838;
      --paper-deep: #1C2030;
      --desk: #14171F;
      --ink: #E8E6DF;
      --ink-soft: #A9AEBC;
      --ink-faint: #6F7587;
      --line: #383D4F;
      --grid: rgba(232, 230, 223, 0.06);
      --hl: #7A6A1E;
      --hl-ink: #FFF3C2;
      --pink: #B2707F;
      --sage: #5F8A68;
      --sky: #5F7FA6;
      --lavender: #8574A8;
      --coral: #B96A5B;
      --correct: #8FCB9C;
      --wrong: #E3907F;
      --ring: #5A5F70;
      --ring-hole: #14171F;
      --note: #4A4322;
      --pen: #F0866F;
      --pen-blue: #8FB4F0;
      --teal: #2F6B66;
      --orange: #8A5A22;
      --card: #2B3042;
      --card-rule: #3F4A62;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
      --focus: #8FB4F0;
    }
  }
  :root[data-theme="dark"] {
    --paper: #232838;
    --paper-deep: #1C2030;
    --desk: #14171F;
    --ink: #E8E6DF;
    --ink-soft: #A9AEBC;
    --ink-faint: #6F7587;
    --line: #383D4F;
    --grid: rgba(232, 230, 223, 0.06);
    --hl: #7A6A1E;
    --hl-ink: #FFF3C2;
    --pink: #B2707F;
    --sage: #5F8A68;
    --sky: #5F7FA6;
    --lavender: #8574A8;
    --coral: #B96A5B;
    --correct: #8FCB9C;
    --wrong: #E3907F;
    --ring: #5A5F70;
    --ring-hole: #14171F;
    --note: #4A4322;
    --pen: #F0866F;
    --pen-blue: #8FB4F0;
    --teal: #2F6B66;
    --orange: #8A5A22;
    --card: #2B3042;
    --card-rule: #3F4A62;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
    --focus: #8FB4F0;
  }

  /* ---------- palettes (topbar 테마 선택, localStorage 'ccaf-palette') ---------- */
  :root[data-palette="white"] {
    --paper: #FFFFFF; --paper-deep: #F3F5F8; --desk: #E9EDF2;
    --ink: #1F2A3A; --ink-soft: #5B6676; --ink-faint: #9AA4B2; --line: #DFE4EB;
    --grid: rgba(47, 95, 168, 0.10);
    --hl: #FFF176; --hl-ink: #1F2A3A;
    --pink: #F7BFCB; --sage: #BFE3CB; --sky: #BCD6F3; --lavender: #D6CBF1; --coral: #F3A896;
    --correct: #2E8B57; --wrong: #D0453A;
    --ring: #C9D0D9; --ring-hole: #E9EDF2; --note: #FFF8C2;
    --pen: #D6483A; --pen-blue: #2F5FA8; --teal: #A8E4DE; --orange: #FFD08A;
    --card: #FFFFFF; --card-rule: #D5E0EE;
    --shadow: 0 14px 34px rgba(31, 42, 58, 0.10), 0 2px 6px rgba(31, 42, 58, 0.06); --focus: #2F5FA8;
  }
  :root[data-palette="paper"] {
    --paper: #F7F6F2; --paper-deep: #EFEDE6; --desk: #E4E1D8;
    --ink: #26324A; --ink-soft: #6B7488; --ink-faint: #A2A8B6; --line: #DCDAD2;
    --grid: rgba(38, 50, 74, 0.07);
    --hl: #FFE066; --hl-ink: #26324A;
    --pink: #F2A9B8; --sage: #A7C9AE; --sky: #A9C4E4; --lavender: #C3B5E0; --coral: #E8907F;
    --correct: #4F8A5B; --wrong: #C25A48;
    --ring: #B9B6AC; --ring-hole: #D5D2C8; --note: #FFF4B8;
    --pen: #D6483A; --pen-blue: #2F5FA8; --teal: #A8DED8; --orange: #FFC98A;
    --card: #FFFDF7; --card-rule: #C9D8EA;
    --shadow: 0 18px 40px rgba(38, 50, 74, 0.14), 0 2px 6px rgba(38, 50, 74, 0.08); --focus: #3D6DB5;
  }
  :root[data-palette="mint"] {
    --paper: #F7FBF9; --paper-deep: #E9F2EE; --desk: #DCEAE4;
    --ink: #1F2E2A; --ink-soft: #5A6C66; --ink-faint: #97A8A2; --line: #D6E3DE;
    --grid: rgba(46, 125, 110, 0.10);
    --hl: #FFF176; --hl-ink: #1F2E2A;
    --pink: #F5BFC8; --sage: #B3DEC3; --sky: #B9D6EC; --lavender: #D2CBEC; --coral: #F0A894;
    --correct: #2E8B57; --wrong: #D0453A;
    --ring: #BFCFC9; --ring-hole: #DCEAE4; --note: #FFF8C2;
    --pen: #D6483A; --pen-blue: #2A6B8F; --teal: #A3E0D3; --orange: #FFD59E;
    --card: #FFFFFF; --card-rule: #CFE3DC;
    --shadow: 0 14px 34px rgba(31, 46, 42, 0.10), 0 2px 6px rgba(31, 46, 42, 0.06); --focus: #2A6B8F;
  }
  :root[data-palette="midnight"] {
    --paper: #1A2130; --paper-deep: #141A27; --desk: #0F1520;
    --ink: #E6EAF0; --ink-soft: #A7B0BE; --ink-faint: #6E7888; --line: #2F3949;
    --grid: rgba(230, 234, 240, 0.06);
    --hl: #8C7A1F; --hl-ink: #FFF3C2;
    --pink: #B2707F; --sage: #5F8A68; --sky: #5F7FA6; --lavender: #8574A8; --coral: #B96A5B;
    --correct: #8FCB9C; --wrong: #E3907F;
    --ring: #4E5769; --ring-hole: #0F1520; --note: #4A4322;
    --pen: #F0866F; --pen-blue: #8FB4F0; --teal: #2F6B66; --orange: #8A5A22;
    --card: #232B3C; --card-rule: #3A455A;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3); --focus: #8FB4F0;
  }
  :root[data-palette="midnight"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
    min-height: 100vh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  code, .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; }
  code { background: var(--paper-deep); padding: 0 5px; border-radius: 4px; }
  mark, .hlsweep {
    color: var(--hl-ink);
    background: linear-gradient(transparent 8%, var(--hl) 8%, var(--hl) 90%, transparent 90%);
    padding: 0 0.15em; border-radius: 2px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  /* 형광펜 띠 제목: 글자 아래쪽에 두꺼운 색 띠 */
  .hlbar { display: inline; padding: 0 6px; background: linear-gradient(transparent 52%, var(--teal) 52%); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hlbar.orange { background: linear-gradient(transparent 52%, var(--orange) 52%); }
  .hlbar.yellow { background: linear-gradient(transparent 52%, var(--hl) 52%); }
  .hlbar.pink { background: linear-gradient(transparent 52%, color-mix(in srgb, var(--pink) 70%, var(--paper)) 52%); }
  /* ---------- hand marks: pen underline, circle, star, scribble ---------- */
  u.pen { text-decoration: underline; text-decoration-color: var(--pen); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  .circ { display: inline; padding: 0 0.35em; border: 1.5px solid var(--pen); border-radius: 4px; color: var(--pen); }
  .star { width: 18px; height: 18px; color: var(--pen); vertical-align: -3px; }
  .scrib { display: inline; padding: 0 6px; background: linear-gradient(transparent 52%, var(--teal) 52%); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .doodle { display: none; }
  .jump {
    font-family: "Gowun Dodum", sans-serif; font-size: 14px; font-weight: 700; color: var(--pen-blue);
    background: none; border: 1.5px solid var(--pen-blue); border-radius: 999px;
    padding: 1px 12px; line-height: 1.6; white-space: nowrap;
  }
  .jump:hover { background: color-mix(in srgb, var(--pen-blue) 10%, transparent); }
  .jump.small { font-size: 13px; }
  .titlerow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 0 0 18px; }
  .titlerow h1.title { margin: 0; }
  .titlerow + .subtitle { margin-top: -10px; }
  .prose strong { color: var(--pen-blue); font-weight: 700; }
  .prose h3.scrib { margin: 24px 0 8px; font-size: 17px; font-weight: 700; }
  h2.sec .rule { flex: 1; height: 1px; background: var(--line); }
  h2.sec.withbtn::after { display: none; }
  .hand { font-family: "Gowun Dodum", sans-serif; }
  .serif { font-family: "Gowun Batang", "Gowun Dodum", serif; }

  /* ---------- desk + book ---------- */
  .desk {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 14px 44px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .topbar .brand { font-family: "Gowun Dodum", sans-serif; font-size: 22px; color: var(--ink); font-weight: 700; border: none; background: none; padding: 0; }
  .topbar .brand:hover { text-decoration: underline; }
  .pager .mid { display: flex; align-items: center; gap: 12px; }
  .pager .home { border: 1.5px solid var(--line); border-radius: 999px; padding: 0 12px; font-size: 14px; }
  .pager .home:hover { background: var(--paper-deep); }
  .topbar .status { font-size: 13px; display: flex; gap: 10px; align-items: center; }
  #palette { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: var(--paper); color: var(--ink); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
  .dot.on { background: var(--correct); }

  .book {
    position: relative;
    display: grid;
    grid-template-columns: 44px 1fr;
    min-height: 620px;
  }
  .binding {
    position: relative;
    background: var(--paper-deep);
    border-radius: 14px 0 0 14px;
    box-shadow: var(--shadow);
  }
  .binding::before {
    content: "";
    position: absolute;
    inset: 24px 0 24px 0;
    background:
      radial-gradient(circle at 50% 50%, var(--ring-hole) 0 5px, transparent 6px) 0 0 / 100% 46px repeat-y;
  }
  .binding::after {
    content: "";
    position: absolute;
    left: 14px; right: 14px; top: 24px; bottom: 24px;
    background: repeating-linear-gradient(to bottom, transparent 0 14px, var(--ring) 14px 26px, transparent 26px 46px);
    border-radius: 6px;
    opacity: 0.9;
    pointer-events: none;
  }

  .page {
    position: relative;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 100%,
      var(--paper);
    border-radius: 0 14px 14px 0;
    box-shadow: var(--shadow);
    padding: 44px 56px 48px 40px;
    overflow: hidden;
  }
  .page.flip { animation: flip 260ms ease-out; }
  @keyframes flip {
    from { opacity: 0.3; transform: translateX(14px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .page.flip { animation: none; } }

  .washi {
    position: absolute;
    top: -6px;
    left: 44%;
    width: 130px;
    height: 26px;
    background: repeating-linear-gradient(135deg, var(--pink) 0 8px, color-mix(in srgb, var(--pink) 60%, var(--paper)) 8px 16px);
    opacity: 0.85;
    border-radius: 2px;
  }
  .washi.blue { background: repeating-linear-gradient(135deg, var(--sky) 0 8px, color-mix(in srgb, var(--sky) 60%, var(--paper)) 8px 16px); }
  .washi.green { background: repeating-linear-gradient(135deg, var(--sage) 0 8px, color-mix(in srgb, var(--sage) 60%, var(--paper)) 8px 16px); }
  .washi.purple { background: repeating-linear-gradient(135deg, var(--lavender) 0 8px, color-mix(in srgb, var(--lavender) 60%, var(--paper)) 8px 16px); }

  /* ---------- index tabs ---------- */
  .tabs {
    position: absolute;
    right: -2px;
    top: 40px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transform: translateX(100%);
    z-index: 2;
  }
  .tab {
    writing-mode: vertical-rl;
    border: none;
    padding: 14px 8px;
    border-radius: 0 10px 10px 0;
    font-family: "Gowun Dodum", sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper-deep);
    box-shadow: 4px 4px 12px rgba(0,0,0,0.08);
    letter-spacing: 0.08em;
    opacity: 0.8;
  }
  .tab.pink { background: var(--pink); }
  .tab.sage { background: var(--sage); }
  .tab.sky { background: var(--sky); }
  .tab.lavender { background: var(--lavender); }
  .tab.active, .tab:hover { opacity: 1; transform: translateX(3px); }

  /* ---------- page furniture ---------- */
  .eyebrow {
    font-family: "Gowun Dodum", sans-serif;
    font-size: 17px;
    color: var(--ink-soft);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .chip {
    display: inline-block;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 14px;
    line-height: 1.7;
    background: var(--paper-deep);
    color: var(--ink-soft);
    font-family: "Gowun Dodum", sans-serif;
  }
  h1.title {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: clamp(22px, 3vw, 28px);
    line-height: 1.35;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  h2.sec {
    font-family: "Gowun Dodum", sans-serif;
    font-size: 21px;
    font-weight: 700;
    margin: 28px 0 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .prose { max-width: none; }
  .prose p { margin: 0 0 10px; }
  .prose ul { margin: 0 0 10px; padding-left: 20px; }
  .prose li { margin: 0 0 4px; }
  .prose h3 { font-family: "Gowun Dodum", sans-serif; font-size: 20px; margin: 22px 0 6px; }
  .prose table { border-collapse: collapse; font-size: 15px; margin: 6px 0 12px; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
  .prose th { background: var(--paper-deep); font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  .sub {
    display: block;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.55;
    margin: 2px 0 0;
    font-family: "Gowun Dodum", sans-serif;
  }
  .prose p .sub, .prose li .sub { margin-top: 1px; }
  .subtitle {
    font-family: "Gowun Dodum", sans-serif;
    font-size: 19px;
    color: var(--ink-soft);
    margin: -12px 0 18px;
  }
  .summary {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.75;
  }
  .summary .lbl { font-family: "Gowun Dodum", sans-serif; font-size: 15px; font-weight: 700; color: var(--pen-blue); margin-right: 8px; }
  .summary .sub { margin-top: 5px; padding-left: 4px; }

  /* ---------- options ---------- */
  .options { display: grid; gap: 10px; margin: 8px 0 4px; }
  .opt {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 10px;
    align-items: start;
    text-align: left;
    padding: 12px 14px;
    background: color-mix(in srgb, var(--paper) 70%, transparent);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    transition: border-color 120ms, background 120ms;
  }
  .opt:hover:not([disabled]) { border-color: var(--ink-faint); }
  .opt .key {
    font-family: "Gowun Dodum", sans-serif;
    font-size: 20px;
    font-weight: 700;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-faint);
    display: grid; place-items: center;
    line-height: 1;
  }
  .opt .txt .en { display: block; }
  .opt .txt .sub { font-size: 13.5px; }
  .opt.chosen { border-color: var(--ink); }
  .opt.right { border-color: var(--correct); background: color-mix(in srgb, var(--sage) 30%, var(--paper)); }
  .opt.right .key { background: var(--correct); color: #fff; border-color: var(--correct); }
  .opt.wrongpick { border-color: var(--wrong); background: color-mix(in srgb, var(--coral) 22%, var(--paper)); }
  .opt.wrongpick .key { background: var(--wrong); color: #fff; border-color: var(--wrong); }
  .opt[disabled] { cursor: default; }

  .verdict {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 14px 0 4px;
    min-height: 44px;
  }
  .stamp { font-size: 16px; font-weight: 700; padding: 1px 12px; border: 2px solid currentColor; border-radius: 6px; letter-spacing: 0.04em; }
  .stamp.ok { color: var(--correct); }
  .stamp.no { color: var(--wrong); }
  .verdict .why { color: var(--ink-soft); font-size: 15px; }

  .reveal { display: none; }
  .reveal.open { display: block; }
  .traps li { margin-bottom: 6px; }
  .traps b { font-family: "Gowun Dodum", sans-serif; font-size: 18px; font-weight: 700; margin-right: 4px; }

  .keypoints { margin: 22px 0 6px; }
  .keypoints .lbl { display: block; margin: 0 0 10px; font-size: 17px; font-weight: 700; }
  .keypoints .lbl span { display: inline; padding: 0 6px; background: linear-gradient(transparent 52%, var(--teal) 52%); }
  .keypoints ul { margin: 0; padding: 0 0 0 26px; list-style: none; }
  .keypoints li { position: relative; margin: 0 0 8px; font-size: 16px; line-height: 1.6; }
  .keypoints li .star { position: absolute; left: -26px; top: 4px; width: 16px; height: 16px; }
  .keypoints li .sub { font-size: 14px; }

  /* ---------- my note ---------- */
  .mynote {
    margin-top: 24px;
    display: grid;
    gap: 10px;
  }
  textarea.note {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px);
    line-height: 28px;
    padding: 0 4px;
    font-family: "Gowun Dodum", sans-serif;
    font-size: 19px;
  }
  textarea.note::placeholder { color: var(--ink-faint); }
  .saved { font-size: 13px; color: var(--ink-faint); min-height: 18px; }

  /* ---------- footer nav ---------- */
  .pager {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 36px 0 0;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    color: var(--ink-soft);
    font-size: 14px;
  }
  .pager button {
    border: none;
    background: transparent;
    font-family: "Gowun Dodum", sans-serif;
    font-size: 19px;
    color: var(--ink);
    padding: 4px 8px;
  }
  .pager button[disabled] { color: var(--ink-faint); cursor: default; }
  .pnum { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ---------- table of contents ---------- */
  .toc { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 4px; }
  .sechead { font-family: "Gowun Dodum", sans-serif; font-size: 20px; font-weight: 700; margin: 18px 0 4px; display: flex; align-items: center; gap: 10px; }
  .sechead::after { content: ""; flex: 1; height: 1px; background: var(--line); }

<script>
(() => {
  'use strict';

  const OWNER = { name: '박미지', course: 'Claude Certified Architect - Foundations', started: '2026. 09' };
  const state = { db: null, backend: null, pages: [], progress: {}, idx: 0 };
  const LS_KEY = 'ccaf-notes-progress';
  const PALETTE_KEY = 'ccaf-palette';
  (() => {
    let pal = 'white'; try { pal = localStorage.getItem(PALETTE_KEY) || pal; } catch {}
    document.documentElement.dataset.palette = pal;
    const sel = document.getElementById('palette'); sel.value = pal;
    sel.addEventListener('change', () => { document.documentElement.dataset.palette = sel.value; try { localStorage.setItem(PALETTE_KEY, sel.value); } catch {} });
  })();
  const $ = (sel, root = document) => root.querySelector(sel);
  const pageEl = $('#page');

  try { state.pages = JSON.parse($('#pages-data').textContent); } catch { state.pages = []; }
  let course = { sections: [] };
  try { course = JSON.parse($('#course-data').textContent) || course; } catch {}
  let site = {};
  try { site = JSON.parse($('#site-data').textContent) || {}; } catch {}
  state.pages.sort((a, b) => (a.order || 0) - (b.order || 0));

  // ---------- outline & book ----------
  // Sections in course order; each lecture carries its note page and quiz pages.
  function outline() {
    const used = new Set();
    const secs = course.sections.map((sec, si) => {
      const lectures = (sec.lectures || []).map(lec => {
        const mine = state.pages.filter(p => p.section === sec.title && String(p.lecture || '') === String(lec.no));
        mine.forEach(p => used.add(p.id));
        return { no: String(lec.no), title: lec.title, notes: mine.filter(p => p.kind === 'lesson'), quiz: mine.filter(p => p.kind !== 'lesson') };
      });
      const loose = state.pages.filter(p => p.section === sec.title && !used.has(p.id));
      loose.forEach(p => used.add(p.id));
      return { no: sec.no != null ? String(sec.no) : String(si + 1), title: sec.title, lectures, loose };
    });
    const rest = state.pages.filter(p => !used.has(p.id));
    if (rest.length) secs.push({ no: 'x', title: 'Unsorted', unsorted: true, lectures: [], loose: rest });
    return secs;
  }
  // Book: cover, toc, PART 1 인강 (section divider → lecture pages), PART 2 문제 (section divider → quizzes).
  function book() {
    const out = [{ kind: 'cover', id: '_cover' }, { kind: 'toc', id: '_toc' }];
    const secs = outline();
    out.push({ kind: 'part', id: '_part-lectures', part: 'lectures' });
    for (const sec of secs) {
      const notes = [...sec.lectures.flatMap(l => l.notes.map(p => Object.assign(p, { _sec: sec, _lec: l }))), ...sec.loose.filter(p => p.kind === 'lesson').map(p => Object.assign(p, { _sec: sec, _lec: null }))];
      if (!notes.length) continue;
      out.push({ kind: 'divider', id: '_lsec-' + sec.no, sec, part: 'lectures' });
      out.push(...notes);
    }
    out.push({ kind: 'part', id: '_part-quiz', part: 'quiz' });
    for (const sec of secs) {
      const qs = [...sec.lectures.flatMap(l => l.quiz.map(p => Object.assign(p, { _sec: sec, _lec: l }))), ...sec.loose.filter(p => p.kind !== 'lesson').map(p => Object.assign(p, { _sec: sec, _lec: null }))];
      if (!qs.length) continue;
      qs.forEach((p, i) => Object.assign(p, { _qi: i + 1, _qn: qs.length }));
      out.push({ kind: 'divider', id: '_qsec-' + sec.no, sec, part: 'quiz' });
      out.push(...qs);
    }
    return out;
  }
  const pageIndex = id => book().findIndex(p => p.id === id);

  // ---------- markup ----------
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // ==형광펜==  **굵게**  __빨간 펜 밑줄__  ((펜 동그라미))  `코드`
  function inline(s) {
    const codes = [];
    const t = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; })
      .replace(/==(.+?)==/g, '<mark>$1</mark>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/__(.+?)__/g, '<u class="pen">$1</u>').replace(/\(\((.+?)\)\)/g, '<span class="circ">$1</span>');
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
  }
  function bi(s, enCls) {
    const i = String(s ?? '').indexOf(' // ');
    const wrap = t => enCls ? '<span class="' + enCls + '">' + t + '</span>' : t;
    if (i < 0) return wrap(inline(s));
    return wrap(inline(s.slice(0, i))) + '<span class="sub">' + inline(s.slice(i + 4)) + '</span>';
  }
  const STAR = '<svg class="star" aria-hidden="true"><use href="#hstar"/></svg>';
  const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
  // 영어 지문을 문장 단위로 잘라 ①②③ 번호를 붙인다. 마크업(==, **, `)은 문장 안에서만 쓴다.
  function sentences(text) {
    const parts = String(text ?? '').split(/(?<=[.?!])\s+(?=["'A-Z{(])/).filter(Boolean);
    if (parts.length < 2) return inline(text);
    return parts.map((t, i) => `<span class="sent"><i class="sn">${CIRCLED[i] || (i + 1)}</i>${inline(t)}</span>`).join(' ');
  }
  function analysis(p) {
    const a = p.pattern; if (!a) return '';
    return `<details class="analysis"><summary>지문 분석${a.type ? `<span class="chip">${esc(a.type)}</span>` : ''}</summary>
      ${a.asks ? `<p class="asks"><b>묻는 것</b>${inline(a.asks)}</p>` : ''}
      ${a.clues?.length ? `<ul class="clues">${a.clues.map(c => `<li><span class="kw"><mark>${esc(c.text)}</mark></span><span class="means">${inline(c.means)}</span></li>`).join('')}</ul>` : ''}
      ${(a.answerShape || a.distractorShape) ? `<div class="shapes">${a.answerShape ? `<div class="ok"><b>정답 모양</b>${inline(a.answerShape)}</div>` : ''}${a.distractorShape ? `<div class="no"><b>오답 모양</b>${inline(a.distractorShape)}</div>` : ''}</div>` : ''}
    </details>`;
  }
  const SCRIPT_KEY = 'ccaf-script-open';
  const scriptOpen = () => { try { return localStorage.getItem(SCRIPT_KEY) !== '0'; } catch { return true; } };
  function md(text) {
    const lines = String(text ?? '').split('\n');
    let html = '', list = null, table = null;
    const flush = () => {
      if (list) { html += '<ul>' + list.map(l => '<li>' + bi(l) + '</li>').join('') + '</ul>'; list = null; }
      if (table) {
        const rows = table.filter(r => !/^\s*\|?\s*-{2,}/.test(r)).map(r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim()));
        const [head, ...body] = rows;
        html += '<div class="tablewrap"><table><thead><tr>' + head.map(c => '<th>' + bi(c) + '</th>').join('') + '</tr></thead><tbody>' +
          body.map(r => '<tr>' + r.map(c => '<td>' + bi(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
        table = null;
      }
    };
    for (const raw of lines) {
      const l = raw.trimEnd();
      if (/^\s*- /.test(l)) { if (table) flush(); (list ||= []).push(l.replace(/^\s*- /, '')); continue; }
      if (/^\s*\|/.test(l)) { if (list) flush(); (table ||= []).push(l); continue; }
      flush();
      if (/^### /.test(l)) html += '<h3 class="scrib blue">' + bi(l.slice(4)) + '</h3>';
      else if (l.trim()) html += '<p>' + bi(l) + '</p>';
    }
    flush();
    return html;
  }

  // ---------- progress storage: artifact db → Supabase → local serve.py → localStorage ----------
  function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
  async function connectSupabase() {
    if (!site.supabaseUrl || !site.supabaseAnonKey) return false;
    try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'); } catch { return false; }
    if (!window.supabase?.createClient) return false;
    const sb = window.supabase.createClient(site.supabaseUrl, site.supabaseAnonKey);
    state.sb = sb; state.backend = 'supabase';
    const btn = $('#authbtn'), dlg = $('#authdlg'), form = dlg.querySelector('form'), err = $('#autherr');
    btn.hidden = false;
    async function refresh() {
      const { data: { session } } = await sb.auth.getSession();
      state.user = session?.user || null;
      if (!state.user) { $('#dbdot').classList.remove('on'); $('#dbmsg').textContent = '로그인하면 진도가 어디서나 이어져요'; btn.textContent = '로그인'; return; }
      btn.textContent = '로그아웃';
      const { data, error } = await sb.from('progress').select('page_id,data').eq('user_id', state.user.id);
      if (error) { $('#dbmsg').textContent = '불러오기 실패: ' + error.message; return; }
      const p = {}; (data || []).forEach(r => { p[r.page_id] = r.data || {}; });
      state.progress = p; lsSet();
      $('#dbdot').classList.add('on'); $('#dbmsg').textContent = 'Supabase 에 저장 · ' + (state.user.email || '');
      render();
    }
    btn.addEventListener('click', async () => {
      if (state.user) { await sb.auth.signOut(); state.user = null; state.progress = {}; lsSet(); await refresh(); render(); return; }
      err.textContent = ''; form.reset(); dlg.showModal();
    });
    dlg.querySelector('[data-cancel]').addEventListener('click', () => dlg.close());
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const { error } = await sb.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
      if (error) { err.textContent = '로그인 실패: ' + error.message; return; }
      dlg.close(); await refresh();
    });
    await refresh();
    return true;
  }
  const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch { return {}; } };
  const lsSet = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state.progress)); } catch {} };
  async function connect() {
    state.progress = lsGet();
    render();
    let db = null;
    try { db = window.claude?.use ? await claude.use('db') : null; } catch { db = null; }
    if (db) {
      state.db = db; state.backend = 'db';
      $('#dbdot').classList.add('on'); $('#dbmsg').textContent = '저장됨';
      db.collection('progress').onSnapshot(snap => {
        const p = {}; snap.docs.forEach(d => { p[d.id] = d.data(); }); state.progress = p; refreshProgress();
      });
      return;
    }
    if (await connectSupabase()) return;
    try {
      const r = await fetch('/api/ping', { cache: 'no-store' });
      if (r.ok && (await r.json()).ok) {
        const d = await (await fetch('/api/data', { cache: 'no-store' })).json();
        state.progress = d.progress || {}; state.backend = 'local';
        $('#dbdot').classList.add('on'); $('#dbmsg').textContent = '프로젝트 폴더에 저장';
        refreshProgress(); return;
      }
    } catch {}
    $('#dbmsg').textContent = '이 브라우저에만 저장';
  }
  const timers = {};
  function saveProgress(id, patch) {
    state.progress[id] = { ...(state.progress[id] || {}), ...patch, studiedAt: new Date().toISOString() };
    lsSet();
    if (!state.backend) return;
    clearTimeout(timers[id]);
    timers[id] = setTimeout(async () => {
      try {
        if (state.db) await state.db.doc('progress/' + id).set(state.progress[id]);
        else if (state.sb) {
          if (!state.user) return;
          const { error } = await state.sb.from('progress').upsert({ user_id: state.user.id, page_id: id, data: state.progress[id], updated_at: new Date().toISOString() });
          if (error) throw error;
        }
        else await fetch('/api/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, data: state.progress[id] }) });
        const s = pageEl.querySelector('.saved'); if (s) s.textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      } catch (e) { const s = pageEl.querySelector('.saved'); if (s) s.textContent = '저장 실패: ' + (e?.message || ''); }
    }, 500);
  }
  function refreshProgress() {
    const p = book()[state.idx]; if (!p) return;
    if (p.kind !== 'lesson' && p.kind !== 'question') { render(); return; }
    const pr = state.progress[p.id] || {};
    const ta = pageEl.querySelector('textarea.note');
    if (ta && document.activeElement !== ta && ta.value !== (pr.note || '')) ta.value = pr.note || '';
  }

  // ---------- routing ----------
  function go(idx) { state.idx = Math.max(0, Math.min(idx, book().length - 1)); location.hash = '#p' + (state.idx + 1); render(); }
  function readHash() {
    const h = location.hash.slice(1);
    if (/^p\d+$/.test(h)) state.idx = Math.max(0, Math.min(parseInt(h.slice(1), 10) - 1, book().length - 1));
  }

  // ---------- render ----------
  function render() {
    const pages = book(), p = pages[state.idx];
    const active = p.kind === 'cover' ? 'cover' : p.kind === 'toc' ? 'toc' : (p.part || (p.kind === 'question' ? 'quiz' : 'lectures'));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === active));
    pageEl.classList.remove('flip'); void pageEl.offsetWidth; pageEl.classList.add('flip');
    if (p.kind === 'cover') renderCover(pages);
    else if (p.kind === 'toc') renderToc(pages);
    else if (p.kind === 'part') renderPart(p, pages);
    else if (p.kind === 'divider') renderDivider(p, pages);
    else if (p.kind === 'lesson') renderLesson(p, pages);
    else renderQuestion(p, pages);
  }
  function pager(pages) {
    const i = state.idx, total = pages.length;
    return `<div class="pager">
      <button data-nav="prev" ${i <= 0 ? 'disabled' : ''}>← 앞 장</button>
      <span class="mid"><button class="home" data-nav="home">홈</button><span class="pnum">${i + 1} / ${total}</span></span>
      <button data-nav="next" ${i >= total - 1 ? 'disabled' : ''}>다음 장 →</button>
    </div>`;
  }
  function wire() {
    pageEl.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go(b.dataset.nav === 'home' ? 0 : state.idx + (b.dataset.nav === 'next' ? 1 : -1))));
    pageEl.querySelectorAll('[data-jump-id]').forEach(b => b.addEventListener('click', () => go(pageIndex(b.dataset.jumpId))));
  }
  function titleBlock(p, extra) {
    const en = p.title_en || p.title, ko = p.title_en ? p.title : '';
    const h1 = `<h1 class="title">${esc(en)}</h1>`;
    return (extra ? `<div class="titlerow">${h1}${extra}</div>` : h1) + (ko ? `<div class="subtitle">${esc(ko)}</div>` : '');
  }
  function eyebrow(p, lead) {
    const bits = [`<span>${lead}</span>`];
    if (p._sec) bits.push(`<span class="chip">${p._sec.unsorted ? '섹션 미정' : 'Section ' + p._sec.no + ' · ' + esc(p._sec.title)}</span>`);
    if (p._lec) bits.push(`<span class="chip">Lecture ${esc(p._lec.no)} · ${esc(p._lec.title)}</span>`);
    return `<div class="eyebrow">${bits.join('')}</div>`;
  }
  function kp(p) {
    if (!p.keyPoints?.length) return '';
    return `<div class="keypoints"><div class="lbl"><span>Exam points</span></div>
      <ul>${p.keyPoints.map(k => '<li>' + STAR + bi(k) + '</li>').join('')}</ul></div>`;
  }
  function trends(p) {
    const t = p.examTrends; if (!t) return '';
    return `<div class="postit"><div class="lbl"><span class="t">시험 경향</span></div>
      ${t.how ? `<h4>How it is asked</h4><p>${bi(t.how)}</p>` : ''}
      ${t.answerLooks?.length ? `<h4>What the right answer looks like</h4><ul class="ticks">${t.answerLooks.map(x => '<li>' + bi(x) + '</li>').join('')}</ul>` : ''}
      ${t.traps?.length ? `<h4>Trap patterns</h4><ul class="crosses">${t.traps.map(x => '<li>' + bi(x) + '</li>').join('')}</ul>` : ''}
      ${t.memorize ? `<div class="memo">${bi(t.memorize)}</div>` : ''}</div>`;
  }
  function noteBlock(pr) {
    return `<div class="mynote">
      <textarea class="note" placeholder="내 말로 정리해 보기. 헷갈린 단어, 외울 문장, 다음에 볼 것.">${esc(pr.note || '')}</textarea>
      <div class="saved">${pr.studiedAt ? '마지막 공부 ' + new Date(pr.studiedAt).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}</div>
    </div>`;
  }
  function wireNote(p) { const ta = pageEl.querySelector('textarea.note'); if (ta) ta.addEventListener('input', () => saveProgress(p.id, { note: ta.value })); }
  const statusOf = p => {
    const pr = state.progress[p.id];
    if (p.kind === 'lesson') return pr?.studiedAt ? ['ok', '읽음'] : ['todo', '아직'];
    if (!pr?.chosen) return ['todo', '아직'];
    return pr.correct ? ['ok', '정답'] : ['no', '오답'];
  };

  // ---------- cover / part / divider / toc ----------
  function renderCover(pages) {
    const qs = state.pages.filter(p => p.kind !== 'lesson'), notes = state.pages.filter(p => p.kind === 'lesson');
    const done = qs.filter(p => state.progress[p.id]?.chosen), right = done.filter(p => state.progress[p.id]?.correct);
    const read = notes.filter(p => state.progress[p.id]?.studiedAt);
    pageEl.innerHTML = `<div class="washi"></div>
      <div class="cover">
        <div class="frame">
          <div class="sticker">문제 ${done.length}/${qs.length}<br><span style="font-size:14px">정답 ${right.length}</span></div>
          <div class="kicker">STUDY NOTEBOOK</div>
          <h1>미지의 CCAF 노트</h1>
          <div class="full">${esc(OWNER.course)}</div>
          <div class="owner">
            <span>이름</span><span>${esc(OWNER.name)}</span>
            <span>시작</span><span>${esc(OWNER.started)}</span>
            <span>인강</span><span>${notes.length}강 중 ${read.length}강 읽음</span>
            <span>문제</span><span>${qs.length}문제 중 ${done.length}문제 풀음</span>
          </div>
        </div>
        <div class="legend">
          <div><b><i class="tag" style="background:var(--sky)"></i>차례</b><span>강의와 문제의 전체 목차. 제목을 누르면 그 장으로.</span></div>
          <div><b><i class="tag" style="background:var(--lavender)"></i>인강</b><span>강의 대본을 영어로, 그 밑에 한국어로 읽으며 인강을 듣는다. 아래에 정리 노트와 시험 포인트.</span></div>
          <div><b><i class="tag" style="background:var(--sage)"></i>문제</b><span>강의별 문제를 풀고 풀이를 본다. 답과 메모는 자동 저장.</span></div>
        </div>
      </div>${pager(pages)}`;
    wire();
  }
  function renderPart(p, pages) {
    const isL = p.part === 'lectures';
    pageEl.innerHTML = `<div class="washi ${isL ? 'purple' : 'green'}"></div>
      <div class="part"><div class="kicker">${isL ? 'PART 1' : 'PART 2'}</div><h1>${isL ? '인강' : '문제'}</h1>
      <p>${isL ? '강의 순서대로 대본을 읽습니다. 영어 문단 아래 한국어가 붙어 있어요.' : '강의 순서대로 문제를 풉니다. 보기를 고르면 풀이가 펼쳐져요.'}</p></div>${pager(pages)}`;
    wire();
  }
  function renderDivider(p, pages) {
    const sec = p.sec, isL = p.part === 'lectures';
    const rows = isL
      ? [...sec.lectures.filter(l => l.notes.length).map(l => ({ no: l.no, title: l.title, first: l.notes[0], cnt: l.notes.length > 1 ? l.notes.length + '장' : '' })),
         ...sec.loose.filter(q => q.kind === 'lesson').map(q => ({ no: '·', title: q.title_en || q.title, first: q, cnt: '' }))]
      : [...sec.lectures.filter(l => l.quiz.length).map(l => ({ no: l.no, title: l.title, first: l.quiz[0], cnt: '문제 ' + l.quiz.length })),
         ...sec.loose.filter(q => q.kind !== 'lesson').map(q => ({ no: '·', title: q.title_en || q.title, first: q, cnt: '' }))];
    pageEl.innerHTML = `<div class="washi ${isL ? 'purple' : 'green'}"></div>
      <div class="divider">
        <div class="secno">${isL ? '인강' : '문제'} · ${sec.unsorted ? 'UNSORTED' : 'SECTION ' + sec.no}</div>
        <h1>${esc(sec.title)}</h1>
        ${sec.unsorted ? '<p class="empty" style="padding:0">아직 어느 강의에 속하는지 정하지 않은 장이에요.</p>' : ''}
        <ul class="lect">${rows.map(r => `<li><span class="no">${esc(r.no)}</span><button data-jump-id="${esc(r.first.id)}">${esc(r.title)}</button><span class="cnt">${esc(r.cnt)}</span></li>`).join('')}</ul>
      </div>${pager(pages)}`;
    wire();
  }
  function renderToc(pages) {
    const secs = outline();
    const lnk = (p, label) => { const [c, l] = statusOf(p); return `<button class="lnk ${c}" data-jump-id="${esc(p.id)}" title="${l}">${label}</button>`; };
    const lecRow = lec => `<div class="lecthead"><span class="no">${esc(lec.no)}</span><div><span class="t">${esc(lec.title)}</span><div class="links">${
      [...lec.notes.map(p => lnk(p, '인강')), ...lec.quiz.map((p, i) => lnk(p, '문제 ' + (i + 1)))].join('') || '<span style="font-size:13px;color:var(--ink-faint)">아직 없음</span>'}</div></div></div>`;
    const looseRow = p => `<div class="lecthead"><span class="no">·</span><div><span class="t">${esc(p.title_en || p.title)}</span><div class="links">${lnk(p, p.kind === 'lesson' ? '인강' : '문제')}</div></div></div>`;
    pageEl.innerHTML = `<div class="washi blue"></div><div class="eyebrow">Contents</div><h1 class="title">Course index</h1><div class="subtitle">섹션 → 강의 순서. 초록은 읽음·정답, 빨강은 오답, 회색은 아직.</div>
      ${secs.map(sec => `<div class="sechead">${sec.unsorted ? '섹션 미정' : 'Section ' + sec.no + ' · ' + esc(sec.title)}</div>${sec.lectures.map(lecRow).join('')}${sec.loose.map(looseRow).join('')}`).join('')}
      ${pager(pages)}`;
    wire();
  }

  // ---------- lesson (인강) ----------
  function renderLesson(p, pages) {
    const pr = state.progress[p.id] || {};
    if (!pr.studiedAt) saveProgress(p.id, { opened: true });
    const hasCore = !!(p.body || p.keyPoints?.length || p.examTrends);
    const hasScript = (p.paragraphs || []).length > 0;
    pageEl.innerHTML = `<div class="washi purple"></div>
      ${eyebrow(p, '인강')}
      ${titleBlock(p, hasCore && hasScript ? '<button class="jump" data-scroll="core" title="대본을 건너뛰고 정리·시험 포인트로">요약 보기 ↓</button>' : '')}
      ${p.summary ? `<div class="summary"><span class="lbl">Summary</span>${bi(p.summary)}</div>` : ''}
      ${hasScript
        ? `<details class="script" ${scriptOpen() ? 'open' : ''}><summary>대본 <span class="cnt">${p.paragraphs.length}줄 · 접었다 펼 수 있어요</span></summary>
           <div class="prose">${p.paragraphs.map(x => `<p class="para"><span class="en">${inline(x.en)}</span>${x.ko ? `<span class="sub">${inline(x.ko)}</span>` : ''}</p>`).join('')}</div></details>`
        : ''}
      ${hasCore ? `<section class="core" id="core">
        <h2 class="sec withbtn"><span class="scrib">핵심 정리</span><i class="rule"></i>${hasScript ? '<button class="jump small" data-scroll="top">대본으로 ↑</button>' : ''}</h2>
        ${p.body ? `<details class="notes" ${hasScript ? '' : 'open'}><summary>정리 노트</summary><div class="prose">${md(p.body)}</div></details>` : ''}
        ${kp(p)}
        ${trends(p)}
      </section>` : ''}
      ${pager(pages)}`;
    wire();
    const sc = pageEl.querySelector('details.script'); if (sc) sc.addEventListener('toggle', () => { try { localStorage.setItem(SCRIPT_KEY, sc.open ? '1' : '0'); } catch {} });
    pageEl.querySelectorAll('[data-scroll]').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.scroll === 'top') { pageEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      const core = pageEl.querySelector('#core'); if (!core) return;
      const d = core.querySelector('details.notes'); if (d) d.open = true;
      core.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  // ---------- question (문제) ----------
  function renderQuestion(p, pages) {
    const pr = state.progress[p.id] || {}, answered = !!pr.chosen;
    pageEl.innerHTML = `<div class="washi green"></div>
      ${eyebrow(p, `문제 ${p._qi} / ${p._qn}`)}
      ${titleBlock(p)}
      <div class="prose qtext"><p>${p.question_en ? sentences(p.question_en) : inline(p.question_ko)}${p.question_en && p.question_ko ? `<span class="sub">${inline(p.question_ko)}</span>` : ''}</p></div>
      ${analysis(p)}
      <div class="options">${(p.options || []).map(o => {
        let cls = 'opt';
        if (answered) { if (o.key === p.answer) cls += ' right'; else if (o.key === pr.chosen) cls += ' wrongpick'; }
        return `<button class="${cls}" data-opt="${esc(o.key)}" ${answered ? 'disabled' : ''}><span class="key">${esc(o.key)}</span>
          <span class="txt"><span class="en">${o.en ? inline(o.en) : inline(o.ko)}</span>${o.en && o.ko ? `<span class="sub">${inline(o.ko)}</span>` : ''}</span></button>`;
      }).join('')}</div>
      <div class="verdict">${answered ? (pr.correct
        ? `<span class="stamp ok">정답!</span><span class="why">고른 답: ${esc(pr.chosen)}</span>`
        : `<span class="stamp no">다시</span><span class="why">고른 답 ${esc(pr.chosen)}, 정답은 ${esc(p.answer)}</span>`) : '<span class="why hand" style="font-size:18px">보기를 고르면 풀이가 펼쳐져요</span>'}
        ${answered ? '<button class="btn ghost" data-retry style="margin-left:auto">다시 풀기</button>' : ''}</div>
      <div class="reveal ${answered ? 'open' : ''}">
        <h2 class="sec"><span class="hlbar orange">Why this answer</span></h2>
        <div class="prose">${md(p.explanation)}</div>
        ${p.traps?.length ? `<h2 class="sec"><span class="hlbar pink">Traps</span></h2><ul class="traps prose">${p.traps.map(t => `<li><b>${esc(t.key)}</b> ${bi(t.why)}</li>`).join('')}</ul>` : ''}
        ${kp(p)}
        ${noteBlock(pr)}
      </div>
      ${pager(pages)}`;
    pageEl.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => { const chosen = b.dataset.opt; saveProgress(p.id, { chosen, correct: chosen === p.answer }); render(); }));
    const retry = pageEl.querySelector('[data-retry]'); if (retry) retry.addEventListener('click', () => { saveProgress(p.id, { chosen: null, correct: null }); render(); });
    wireNote(p); wire();
  }

  // ---------- global ----------
  $('#homebtn').addEventListener('click', () => go(0));
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowRight') go(state.idx + 1);
    if (e.key === 'ArrowLeft') go(state.idx - 1);
  });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    const v = t.dataset.view, pages = book();
    if (v === 'cover') return go(0);
    if (v === 'toc') return go(1);
    const cur = pages[state.idx];
    if ((cur.part || (cur.kind === 'question' ? 'quiz' : cur.kind === 'lesson' ? 'lectures' : '')) === v) return;
    const firstContent = pages.findIndex(p => v === 'lectures' ? p.kind === 'lesson' : p.kind === 'question');
    go(firstContent >= 0 ? firstContent : pages.findIndex(p => p.kind === 'part' && p.part === v));
  }));
  window.addEventListener('hashchange', () => { readHash(); render(); });

  readHash();
  connect();
})();
</script>
