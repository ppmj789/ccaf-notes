<title>미지의 CCAF 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #F7F6F2;
    --paper-deep: #EFEDE6;
    --desk: #E4E1D8;
    --ink: #26324A;
    --ink-soft: #6B7488;
    --ink-faint: #A2A8B6;
    --line: #DCDAD2;
    --grid: rgba(38, 50, 74, 0.07);
    --hl: #FFE066;
    --hl-ink: #26324A;
    --pink: #F2A9B8;
    --sage: #A7C9AE;
    --sky: #A9C4E4;
    --lavender: #C3B5E0;
    --coral: #E8907F;
    --correct: #4F8A5B;
    --wrong: #C25A48;
    --ring: #B9B6AC;
    --ring-hole: #D5D2C8;
    --note: #FFF4B8;
    --shadow: 0 18px 40px rgba(38, 50, 74, 0.14), 0 2px 6px rgba(38, 50, 74, 0.08);
    --focus: #3D6DB5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #232838;
      --paper-deep: #1C2030;
      --desk: #14171F;
      --ink: #E8E6DF;
      --ink-soft: #A9AEBC;
      --ink-faint: #6F7587;
      --line: #383D4F;
      --grid: rgba(232, 230, 223, 0.06);
      --hl: #7A6A1E;
      --hl-ink: #FFF3C2;
      --pink: #B2707F;
      --sage: #5F8A68;
      --sky: #5F7FA6;
      --lavender: #8574A8;
      --coral: #B96A5B;
      --correct: #8FCB9C;
      --wrong: #E3907F;
      --ring: #5A5F70;
      --ring-hole: #14171F;
      --note: #4A4322;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
      --focus: #8FB4F0;
    }
  }
  :root[data-theme="dark"] {
    --paper: #232838;
    --paper-deep: #1C2030;
    --desk: #14171F;
    --ink: #E8E6DF;
    --ink-soft: #A9AEBC;
    --ink-faint: #6F7587;
    --line: #383D4F;
    --grid: rgba(232, 230, 223, 0.06);
    --hl: #7A6A1E;
    --hl-ink: #FFF3C2;
    --pink: #B2707F;
    --sage: #5F8A68;
    --sky: #5F7FA6;
    --lavender: #8574A8;
    --coral: #B96A5B;
    --correct: #8FCB9C;
    --wrong: #E3907F;
    --ring: #5A5F70;
    --ring-hole: #14171F;
    --note: #4A4322;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
    --focus: #8FB4F0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
    min-height: 100vh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  code, .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; }
  code { background: var(--paper-deep); padding: 0 5px; border-radius: 4px; }
  mark { background: var(--hl); color: var(--hl-ink); padding: 0 3px; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hand { font-family: "Gaegu", "Gowun Dodum", sans-serif; }
  .serif { font-family: "Gowun Batang", "Gowun Dodum", serif; }

  /* ---------- desk + book ---------- */
  .desk {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 14px 44px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .topbar .brand { font-family: "Gaegu", sans-serif; font-size: 22px; color: var(--ink); font-weight: 700; }
  .topbar .status { font-size: 13px; display: flex; gap: 10px; align-items: center; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
  .dot.on { background: var(--correct); }

  .book {
    position: relative;
    display: grid;
    grid-template-columns: 44px 1fr;
    min-height: 620px;
  }
  .binding {
    position: relative;
    background: var(--paper-deep);
    border-radius: 14px 0 0 14px;
    box-shadow: var(--shadow);
  }
  .binding::before {
    content: "";
    position: absolute;
    inset: 24px 0 24px 0;
    background:
      radial-gradient(circle at 50% 50%, var(--ring-hole) 0 5px, transparent 6px) 0 0 / 100% 46px repeat-y;
  }
  .binding::after {
    content: "";
    position: absolute;
    left: 14px; right: 14px; top: 24px; bottom: 24px;
    background: repeating-linear-gradient(to bottom, transparent 0 14px, var(--ring) 14px 26px, transparent 26px 46px);
    border-radius: 6px;
    opacity: 0.9;
    pointer-events: none;
  }

  .page {
    position: relative;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 100%,
      var(--paper);
    border-radius: 0 14px 14px 0;
    box-shadow: var(--shadow);
    padding: 44px 56px 48px 40px;
    overflow: hidden;
  }
  .page.flip { animation: flip 260ms ease-out; }
  @keyframes flip {
    from { opacity: 0.3; transform: translateX(14px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .page.flip { animation: none; } }

  .washi {
    position: absolute;
    top: -6px;
    left: 44%;
    width: 130px;
    height: 26px;
    transform: rotate(-3deg);
    background: repeating-linear-gradient(135deg, var(--pink) 0 8px, color-mix(in srgb, var(--pink) 60%, var(--paper)) 8px 16px);
    opacity: 0.85;
    border-radius: 2px;
  }
  .washi.blue { background: repeating-linear-gradient(135deg, var(--sky) 0 8px, color-mix(in srgb, var(--sky) 60%, var(--paper)) 8px 16px); }
  .washi.green { background: repeating-linear-gradient(135deg, var(--sage) 0 8px, color-mix(in srgb, var(--sage) 60%, var(--paper)) 8px 16px); }
  .washi.purple { background: repeating-linear-gradient(135deg, var(--lavender) 0 8px, color-mix(in srgb, var(--lavender) 60%, var(--paper)) 8px 16px); }

  /* ---------- index tabs ---------- */
  .tabs {
    position: absolute;
    right: -2px;
    top: 40px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transform: translateX(100%);
    z-index: 2;
  }
  .tab {
    writing-mode: vertical-rl;
    border: none;
    padding: 14px 8px;
    border-radius: 0 10px 10px 0;
    font-family: "Gaegu", sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper-deep);
    box-shadow: 4px 4px 12px rgba(0,0,0,0.08);
    letter-spacing: 0.08em;
    opacity: 0.8;
  }
  .tab.pink { background: var(--pink); }
  .tab.sage { background: var(--sage); }
  .tab.sky { background: var(--sky); }
  .tab.lavender { background: var(--lavender); }
  .tab.active, .tab:hover { opacity: 1; transform: translateX(3px); }

  /* ---------- page furniture ---------- */
  .eyebrow {
    font-family: "Gaegu", sans-serif;
    font-size: 17px;
    color: var(--ink-soft);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .chip {
    display: inline-block;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 14px;
    line-height: 1.7;
    background: var(--paper-deep);
    color: var(--ink-soft);
    font-family: "Gowun Dodum", sans-serif;
  }
  h1.title {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: clamp(22px, 3vw, 28px);
    line-height: 1.35;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  h2.sec {
    font-family: "Gaegu", sans-serif;
    font-size: 21px;
    font-weight: 700;
    margin: 28px 0 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .prose { max-width: 62ch; }
  .prose p { margin: 0 0 10px; }
  .prose ul { margin: 0 0 10px; padding-left: 20px; }
  .prose li { margin: 0 0 4px; }
  .prose h3 { font-family: "Gaegu", sans-serif; font-size: 20px; margin: 22px 0 6px; }
  .prose table { border-collapse: collapse; font-size: 15px; margin: 6px 0 12px; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
  .prose th { background: var(--paper-deep); font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  .sub {
    display: block;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.55;
    margin: 2px 0 0;
    font-family: "Gowun Dodum", sans-serif;
  }
  .prose p .sub, .prose li .sub { margin-top: 1px; }
  .subtitle {
    font-family: "Gaegu", sans-serif;
    font-size: 19px;
    color: var(--ink-soft);
    margin: -12px 0 18px;
  }
  .summary {
    background: color-mix(in srgb, var(--sky) 22%, var(--paper));
    border-left: 3px solid var(--sky);
    padding: 8px 14px;
    border-radius: 0 10px 10px 0;
    margin: 0 0 14px;
    max-width: 62ch;
    font-size: 15px;
  }
  .summary .lbl { font-family: "Gaegu", sans-serif; font-size: 17px; color: var(--ink-soft); margin-right: 6px; }

  /* ---------- options ---------- */
  .options { display: grid; gap: 10px; margin: 8px 0 4px; }
  .opt {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 10px;
    align-items: start;
    text-align: left;
    padding: 12px 14px;
    background: color-mix(in srgb, var(--paper) 70%, transparent);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    transition: border-color 120ms, background 120ms;
  }
  .opt:hover:not([disabled]) { border-color: var(--ink-faint); }
  .opt .key {
    font-family: "Gaegu", sans-serif;
    font-size: 20px;
    font-weight: 700;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-faint);
    display: grid; place-items: center;
    line-height: 1;
  }
  .opt .txt .en { display: block; }
  .opt .txt .sub { font-size: 13.5px; }
  .opt.chosen { border-color: var(--ink); }
  .opt.right { border-color: var(--correct); background: color-mix(in srgb, var(--sage) 30%, var(--paper)); }
  .opt.right .key { background: var(--correct); color: #fff; border-color: var(--correct); }
  .opt.wrongpick { border-color: var(--wrong); background: color-mix(in srgb, var(--coral) 22%, var(--paper)); }
  .opt.wrongpick .key { background: var(--wrong); color: #fff; border-color: var(--wrong); }
  .opt[disabled] { cursor: default; }

  .verdict {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 14px 0 4px;
    min-height: 44px;
  }
  .stamp {
    font-family: "Gaegu", sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 2px 14px;
    border: 2.5px solid currentColor;
    border-radius: 12px;
    transform: rotate(-6deg);
    letter-spacing: 0.06em;
    opacity: 0.9;
  }
  .stamp.ok { color: var(--correct); }
  .stamp.no { color: var(--wrong); }
  .verdict .why { color: var(--ink-soft); font-size: 15px; }

  .reveal { display: none; }
  .reveal.open { display: block; }
  .traps li { margin-bottom: 6px; }
  .traps b { font-family: "Gaegu", sans-serif; font-size: 18px; font-weight: 700; margin-right: 4px; }
  .keypoints {
    background: var(--note);
    border-radius: 4px 14px 4px 14px;
    padding: 14px 18px;
    margin: 12px 0 4px;
    transform: rotate(0.4deg);
    box-shadow: 2px 3px 8px rgba(0,0,0,0.08);
    max-width: 62ch;
  }
  .keypoints .lbl { font-family: "Gaegu", sans-serif; font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .keypoints ul { margin: 0; padding-left: 18px; }

  /* ---------- my note ---------- */
  .mynote {
    margin-top: 24px;
    display: grid;
    gap: 10px;
  }
  textarea.note {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px);
    line-height: 28px;
    padding: 0 4px;
    font-family: "Gaegu", sans-serif;
    font-size: 19px;
  }
  textarea.note::placeholder { color: var(--ink-faint); }
  .saved { font-size: 13px; color: var(--ink-faint); min-height: 18px; }

  /* ---------- footer nav ---------- */
  .pager {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 36px 0 0;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    color: var(--ink-soft);
    font-size: 14px;
  }
  .pager button {
    border: none;
    background: transparent;
    font-family: "Gaegu", sans-serif;
    font-size: 19px;
    color: var(--ink);
    padding: 4px 8px;
  }
  .pager button[disabled] { color: var(--ink-faint); cursor: default; }
  .pnum { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ---------- table of contents ---------- */
  .toc { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 4px; }
  .sechead { font-family: "Gaegu", sans-serif; font-size: 20px; font-weight: 700; margin: 18px 0 4px; display: flex; align-items: center; gap: 10px; }
  .sechead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .toc .sum { grid-column: 2 / -1; font-size: 13.5px; color: var(--ink-soft); margin-top: -2px; }
  .toc li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 6px; border-bottom: 1px dotted var(--line); }
  .toc li button { border: none; background: none; text-align: left; padding: 0; line-height: 1.5; }
  .toc li button:hover { text-decoration: underline; }
  .toc .n { font-family: "IBM Plex Mono", monospace; color: var(--ink-faint); font-size: 13px; }
  .toc .st { font-family: "Gaegu", sans-serif; font-size: 16px; }
  .st.ok { color: var(--correct); } .st.no { color: var(--wrong); } .st.todo { color: var(--ink-faint); }
  .st.lesson { color: var(--ink-soft); }
  .toc .dom { font-size: 13px; color: var(--ink-soft); margin-left: 6px; }

  /* ---------- progress ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 10px 0 20px; max-width: 520px; }
  .stat { text-align: center; padding: 12px 8px; border: 1.5px solid var(--line); border-radius: 12px; }
  .stat .big { font-family: "Gowun Batang", serif; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .lbl { font-family: "Gaegu", sans-serif; font-size: 17px; color: var(--ink-soft); }
  .bar { height: 12px; background: var(--paper-deep); border-radius: 999px; overflow: hidden; max-width: 520px; }
  .bar i { display: block; height: 100%; background: var(--sage); }
  .domains { display: grid; gap: 6px; margin-top: 16px; max-width: 520px; }
  .domains div { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .domains .bar { height: 8px; }

  .empty { color: var(--ink-soft); padding: 20px 0; }
  .notice {
    margin: 0 0 14px 44px;
    padding: 8px 14px;
    background: color-mix(in srgb, var(--coral) 20%, var(--paper));
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  .notice.open { display: block; }

  @media (max-width: 720px) {
    .desk { padding: 16px 8px 40px; }
    .book { grid-template-columns: 26px 1fr; }
    .page { padding: 34px 22px 32px 18px; border-radius: 0 10px 10px 0; }
    .tabs { transform: none; right: 0; top: auto; bottom: -46px; flex-direction: row; left: 0; justify-content: center; }
    .tab { writing-mode: horizontal-tb; padding: 6px 12px; border-radius: 10px 10px 0 0; font-size: 15px; }
    .desk { padding-bottom: 80px; }
    .topbar, .notice { margin-left: 0; }
    .washi { width: 90px; left: 50%; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .domains div { grid-template-columns: 96px 1fr auto; }
  }
</style>

<div class="desk">
  <div class="topbar">
    <span class="brand">미지의 CCAF 노트</span>
    <span class="status"><span class="dot" id="dbdot"></span><span id="dbmsg">메모 저장 준비 중</span></span>
  </div>

  <div class="book">
    <div class="binding" aria-hidden="true"></div>
    <div class="page" id="page"></div>
    <nav class="tabs" aria-label="구역">
      <button class="tab pink" data-view="toc">차례</button>
      <button class="tab sky" data-view="study">공부</button>
      <button class="tab sage" data-view="wrong">오답</button>
      <button class="tab lavender" data-view="progress">진도</button>
    </nav>
  </div>
</div>

<script id="pages-data" type="application/json">/*__PAGES__*/</script>
<script>
(() => {
  'use strict';

  const DOMAINS = ['모델 선택', '프롬프트·평가', '툴·에이전트 루프', '지식·RAG', '멀티에이전트', 'Claude Code', '신뢰성'];
  const state = {
    db: null,
    pages: [],
    progress: {},
    view: 'study',
    idx: 0,
  };
  const LS_KEY = 'ccaf-notes-progress';

  const $ = (sel, root = document) => root.querySelector(sel);
  const pageEl = $('#page');

  try { state.pages = JSON.parse($('#pages-data').textContent); } catch { state.pages = []; }
  state.pages.sort((a, b) => (a.order || 0) - (b.order || 0));

  // ---------- tiny markup ----------
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function inline(s) {
    return esc(s)
      .replace(/==(.+?)==/g, '<mark>$1</mark>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function bi(s) {
    const i = String(s ?? '').indexOf(' // ');
    if (i < 0) return inline(s);
    return inline(s.slice(0, i)) + '<span class="sub">' + inline(s.slice(i + 4)) + '</span>';
  }
  function md(text) {
    const lines = String(text ?? '').split('\n');
    let html = '', list = null, table = null;
    const flush = () => {
      if (list) { html += '<ul>' + list.map(l => '<li>' + bi(l) + '</li>').join('') + '</ul>'; list = null; }
      if (table) {
        const rows = table.filter(r => !/^\s*\|?\s*-{2,}/.test(r)).map(r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim()));
        const [head, ...body] = rows;
        html += '<div class="tablewrap"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
          body.map(r => '<tr>' + r.map(c => '<td>' + bi(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
        table = null;
      }
    };
    for (const raw of lines) {
      const l = raw.trimEnd();
      if (/^\s*- /.test(l)) { if (table) flush(); (list ||= []).push(l.replace(/^\s*- /, '')); continue; }
      if (/^\s*\|/.test(l)) { if (list) flush(); (table ||= []).push(l); continue; }
      flush();
      if (/^### /.test(l)) html += '<h3>' + bi(l.slice(4)) + '</h3>';
      else if (l.trim()) html += '<p>' + bi(l) + '</p>';
    }
    flush();
    return html;
  }

  // ---------- progress storage: db when available, else localStorage ----------
  function loadLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch { return {}; } }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.progress)); } catch {} }

  async function connect() {
    state.progress = loadLocal();
    render();
    let db = null;
    try { db = window.claude?.use ? await claude.use('db') : null; } catch { db = null; }
    if (!db) { $('#dbmsg').textContent = '이 브라우저에만 저장'; return; }
    state.db = db;
    $('#dbdot').classList.add('on');
    $('#dbmsg').textContent = '메모 저장됨';
    db.collection('progress').onSnapshot(snap => {
      const p = {};
      snap.docs.forEach(d => { p[d.id] = d.data(); });
      state.progress = p;
      if (state.view === 'study') refreshStudyProgressOnly(); else render();
    });
  }

  const saveTimers = {};
  function saveProgress(pageId, patch) {
    state.progress[pageId] = { ...(state.progress[pageId] || {}), ...patch, studiedAt: new Date().toISOString() };
    saveLocal();
    if (!state.db) return;
    clearTimeout(saveTimers[pageId]);
    saveTimers[pageId] = setTimeout(async () => {
      try {
        await state.db.doc('progress/' + pageId).set(state.progress[pageId]);
        const s = pageEl.querySelector('.saved'); if (s) s.textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        const s = pageEl.querySelector('.saved'); if (s) s.textContent = '저장 실패: ' + (e?.message || e?.code || '');
      }
    }, 500);
  }

  // ---------- routing ----------
  function go(view, idx) {
    state.view = view;
    if (typeof idx === 'number') state.idx = idx;
    location.hash = view === 'study' ? '#p' + (state.idx + 1) : '#' + view;
    render();
  }
  function readHash() {
    const h = location.hash.slice(1);
    if (/^p\d+$/.test(h)) { state.view = 'study'; state.idx = Math.max(0, parseInt(h.slice(1), 10) - 1); }
    else if (['toc', 'wrong', 'progress'].includes(h)) state.view = h;
    if (state.idx >= state.pages.length) state.idx = Math.max(0, state.pages.length - 1);
  }

  // ---------- render ----------
  function render() {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === state.view));
    pageEl.classList.remove('flip'); void pageEl.offsetWidth; pageEl.classList.add('flip');
    if (state.view === 'study') renderStudy();
    else if (state.view === 'toc') renderToc();
    else if (state.view === 'wrong') renderWrong();
    else if (state.view === 'progress') renderProgress();
  }

  function pager(i, total) {
    return `<div class="pager">
      <button data-nav="prev" ${i <= 0 ? 'disabled' : ''}>← 앞 장</button>
      <span class="pnum">${total ? i + 1 : 0} / ${total}</span>
      <button data-nav="next" ${i >= total - 1 ? 'disabled' : ''}>다음 장 →</button>
    </div>`;
  }
  function titleBlock(p) {
    const en = p.title_en || p.title, ko = p.title_en ? p.title : '';
    return `<h1 class="title">${esc(en)}</h1>${ko ? `<div class="subtitle">${esc(ko)}</div>` : ''}`;
  }
  function eyebrow(p, lead) {
    const bits = [`<span>${lead}</span>`];
    if (p.section) bits.push(`<span class="chip">${esc(p.section)}</span>`);
    if (p.lecture) bits.push(`<span class="chip">${esc(p.lecture)}</span>`);
    if (p.domain) bits.push(`<span class="chip">${esc(p.domain)}</span>`);
    return `<div class="eyebrow">${bits.join('')}</div>`;
  }
  function kp(p) { return p.keyPoints?.length ? `<div class="keypoints"><div class="lbl">Exam points</div><ul>${p.keyPoints.map(k => '<li>' + bi(k) + '</li>').join('')}</ul></div>` : ''; }
  function qNumber(p) { let n = 0; for (const x of state.pages) { if (x.kind !== 'lesson') n++; if (x.id === p.id) return n; } return n; }

  function renderStudy() {
    const total = state.pages.length;
    if (!total) {
      pageEl.innerHTML = `<div class="washi"></div><div class="eyebrow">Empty notebook</div><h1 class="title">아직 장이 없어요</h1><p class="empty">pages/ 폴더에 JSON 을 넣고 build.py 를 돌리면 장이 생겨요.</p>`;
      return;
    }
    const p = state.pages[state.idx];
    const pr = state.progress[p.id] || {};
    const washi = ['', 'blue', 'green', 'purple'][state.idx % 4];
    if (p.kind === 'lesson') {
      pageEl.innerHTML = `<div class="washi ${washi}"></div>
        ${eyebrow(p, 'Lecture note')}
        ${titleBlock(p)}
        ${p.summary ? `<div class="summary"><span class="lbl">Summary</span>${bi(p.summary)}</div>` : ''}
        <div class="prose">${md(p.body)}</div>
        ${kp(p)}
        ${noteBlock(pr)}
        ${pager(state.idx, total)}`;
    } else {
      const answered = !!pr.chosen;
      pageEl.innerHTML = `<div class="washi ${washi}"></div>
        ${eyebrow(p, 'Question ' + String(qNumber(p)).padStart(2, '0'))}
        ${titleBlock(p)}
        <div class="prose">
          <p>${p.question_en ? esc(p.question_en) : inline(p.question_ko)}${p.question_en && p.question_ko ? `<span class="sub">${inline(p.question_ko)}</span>` : ''}</p>
        </div>
        <div class="options">${(p.options || []).map(o => {
          let cls = 'opt';
          if (answered) { if (o.key === p.answer) cls += ' right'; else if (o.key === pr.chosen) cls += ' wrongpick'; }
          return `<button class="${cls}" data-opt="${esc(o.key)}" ${answered ? 'disabled' : ''}>
            <span class="key">${esc(o.key)}</span>
            <span class="txt"><span class="en">${o.en ? esc(o.en) : inline(o.ko)}</span>${o.en && o.ko ? `<span class="sub">${inline(o.ko)}</span>` : ''}</span></button>`;
        }).join('')}</div>
        <div class="verdict">${answered ? (pr.correct
          ? `<span class="stamp ok">정답!</span><span class="why">고른 답: ${esc(pr.chosen)}</span>`
          : `<span class="stamp no">다시</span><span class="why">고른 답 ${esc(pr.chosen)}, 정답은 ${esc(p.answer)}</span>`) : '<span class="why hand" style="font-size:18px">보기를 고르면 풀이가 펼쳐져요</span>'}
          ${answered ? '<button class="btn ghost" data-retry style="margin-left:auto">다시 풀기</button>' : ''}</div>
        <div class="reveal ${answered ? 'open' : ''}">
          <h2 class="sec">Why this answer</h2>
          <div class="prose">${md(p.explanation)}</div>
          ${p.traps?.length ? `<h2 class="sec">Traps</h2><ul class="traps prose">${p.traps.map(t => `<li><b>${esc(t.key)}</b> ${bi(t.why)}</li>`).join('')}</ul>` : ''}
          ${kp(p)}
          ${noteBlock(pr)}
        </div>
        ${pager(state.idx, total)}`;
      pageEl.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
        const chosen = b.dataset.opt;
        saveProgress(p.id, { chosen, correct: chosen === p.answer });
        renderStudy();
      }));
      const retry = pageEl.querySelector('[data-retry]');
      if (retry) retry.addEventListener('click', () => { saveProgress(p.id, { chosen: null, correct: null }); renderStudy(); });
    }
    const ta = pageEl.querySelector('textarea.note');
    if (ta) ta.addEventListener('input', () => saveProgress(p.id, { note: ta.value }));
    pageEl.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      go('study', state.idx + (b.dataset.nav === 'next' ? 1 : -1));
    }));
  }

  function noteBlock(pr) {
    return `<div class="mynote">
      <textarea class="note" placeholder="내 말로 정리해 보기. 헷갈린 단어, 외울 문장, 다음에 볼 것.">${esc(pr.note || '')}</textarea>
      <div class="saved">${pr.studiedAt ? '마지막 공부 ' + new Date(pr.studiedAt).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}</div>
    </div>`;
  }
  function refreshStudyProgressOnly() {
    const p = state.pages[state.idx]; if (!p) return;
    const pr = state.progress[p.id] || {};
    const ta = pageEl.querySelector('textarea.note');
    if (ta && document.activeElement !== ta && ta.value !== (pr.note || '')) ta.value = pr.note || '';
  }

  // ---------- toc / wrong / progress ----------
  function statusOf(p) {
    const pr = state.progress[p.id];
    if (p.kind === 'lesson') return pr?.studiedAt ? ['lesson', '읽음'] : ['todo', '아직'];
    if (!pr?.chosen) return ['todo', '아직'];
    return pr.correct ? ['ok', '정답'] : ['no', '오답'];
  }
  function tocRows(items) {
    return `<ul class="toc">${items.map(p => {
      const [cls, lbl] = statusOf(p); const i = state.pages.indexOf(p);
      return `<li><span class="n">${String(i + 1).padStart(2, '0')}</span>
        <button data-jump="${i}">${esc(p.title_en || p.title)}<span class="dom">${p.title_en ? esc(p.title) + ' · ' : ''}${p.kind === 'lesson' ? 'note' : esc(p.domain || '')}</span></button>
        <span class="st ${cls}">${lbl}</span>
        ${p.kind === 'lesson' && p.summary ? `<span class="sum">${bi(p.summary)}</span>` : ''}</li>`;
    }).join('')}</ul>`;
  }
  function tocList(items, grouped) {
    if (!items.length) return '<p class="empty">여기 들어갈 장이 아직 없어요.</p>';
    if (!grouped) return tocRows(items);
    const groups = [];
    for (const p of items) {
      const key = p.section || 'Ungrouped';
      let g = groups.find(x => x.key === key); if (!g) groups.push(g = { key, items: [] });
      g.items.push(p);
    }
    return groups.map(g => `<div class="sechead">${esc(g.key)}</div>${tocRows(g.items)}`).join('');
  }
  function wireJumps() { pageEl.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => go('study', Number(b.dataset.jump)))); }

  function renderToc() {
    pageEl.innerHTML = `<div class="washi"></div><div class="eyebrow">Contents</div><h1 class="title">Course index</h1><div class="subtitle">섹션별 강의 노트와 문제</div>${tocList(state.pages, true)}`;
    wireJumps();
  }
  function renderWrong() {
    const items = state.pages.filter(p => { const pr = state.progress[p.id]; return pr && pr.chosen && !pr.correct; });
    pageEl.innerHTML = `<div class="washi green"></div><div class="eyebrow">Wrong answers</div><h1 class="title">틀린 문제</h1>
      <p class="prose" style="color:var(--ink-soft)">틀린 문제가 모여요. 장을 열어 <b>다시 풀기</b>를 누르면 다시 풀 수 있어요.</p>
      ${tocList(items)}`;
    wireJumps();
  }
  function renderProgress() {
    const qs = state.pages.filter(p => p.kind !== 'lesson');
    const done = qs.filter(p => state.progress[p.id]?.chosen);
    const right = done.filter(p => state.progress[p.id]?.correct);
    const notes = state.pages.filter(p => (state.progress[p.id]?.note || '').trim());
    const pct = qs.length ? Math.round(done.length / qs.length * 100) : 0;
    const byDom = DOMAINS.map(d => {
      const list = qs.filter(p => p.domain === d); const ok = list.filter(p => state.progress[p.id]?.correct);
      return { d, n: list.length, ok: ok.length };
    }).filter(x => x.n);
    pageEl.innerHTML = `<div class="washi purple"></div><div class="eyebrow">Progress</div><h1 class="title">어디까지 왔나</h1>
      <div class="stats">
        <div class="stat"><div class="big">${done.length}<span style="font-size:16px;color:var(--ink-soft)">/${qs.length}</span></div><div class="lbl">푼 문제</div></div>
        <div class="stat"><div class="big">${done.length ? Math.round(right.length / done.length * 100) : 0}%</div><div class="lbl">정답률</div></div>
        <div class="stat"><div class="big">${notes.length}</div><div class="lbl">메모한 장</div></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="domains">${byDom.map(x => `<div><span>${esc(x.d)}</span><span class="bar"><i style="width:${x.n ? x.ok / x.n * 100 : 0}%"></i></span><span class="pnum">${x.ok}/${x.n}</span></div>`).join('')}</div>
      <h2 class="sec">Exam domains</h2>
      <div class="prose"><ul>${DOMAINS.map(d => `<li>${esc(d)} <span style="color:var(--ink-faint)">· ${qs.filter(p => p.domain === d).length}문제</span></li>`).join('')}</ul></div>`;
  }

  document.addEventListener('keydown', e => {
    if (state.view !== 'study' || e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowRight' && state.idx < state.pages.length - 1) go('study', state.idx + 1);
    if (e.key === 'ArrowLeft' && state.idx > 0) go('study', state.idx - 1);
  });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.view)));
  window.addEventListener('hashchange', () => { readHash(); render(); });

  readHash();
  connect();
})();
</script>
