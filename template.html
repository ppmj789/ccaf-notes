<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미지의 CCAF 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #F7F6F2;
    --paper-deep: #EFEDE6;
    --desk: #E4E1D8;
    --ink: #26324A;
    --ink-soft: #6B7488;
    --ink-faint: #A2A8B6;
    --line: #DCDAD2;
    --grid: rgba(38, 50, 74, 0.07);
    --hl: #FFE066;
    --hl-ink: #26324A;
    --pink: #F2A9B8;
    --sage: #A7C9AE;
    --sky: #A9C4E4;
    --lavender: #C3B5E0;
    --coral: #E8907F;
    --correct: #4F8A5B;
    --wrong: #C25A48;
    --ring: #B9B6AC;
    --ring-hole: #D5D2C8;
    --note: #FFF4B8;
    --shadow: 0 18px 40px rgba(38, 50, 74, 0.14), 0 2px 6px rgba(38, 50, 74, 0.08);
    --focus: #3D6DB5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #232838;
      --paper-deep: #1C2030;
      --desk: #14171F;
      --ink: #E8E6DF;
      --ink-soft: #A9AEBC;
      --ink-faint: #6F7587;
      --line: #383D4F;
      --grid: rgba(232, 230, 223, 0.06);
      --hl: #7A6A1E;
      --hl-ink: #FFF3C2;
      --pink: #B2707F;
      --sage: #5F8A68;
      --sky: #5F7FA6;
      --lavender: #8574A8;
      --coral: #B96A5B;
      --correct: #8FCB9C;
      --wrong: #E3907F;
      --ring: #5A5F70;
      --ring-hole: #14171F;
      --note: #4A4322;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
      --focus: #8FB4F0;
    }
  }
  :root[data-theme="dark"] {
    --paper: #232838;
    --paper-deep: #1C2030;
    --desk: #14171F;
    --ink: #E8E6DF;
    --ink-soft: #A9AEBC;
    --ink-faint: #6F7587;
    --line: #383D4F;
    --grid: rgba(232, 230, 223, 0.06);
    --hl: #7A6A1E;
    --hl-ink: #FFF3C2;
    --pink: #B2707F;
    --sage: #5F8A68;
    --sky: #5F7FA6;
    --lavender: #8574A8;
    --coral: #B96A5B;
    --correct: #8FCB9C;
    --wrong: #E3907F;
    --ring: #5A5F70;
    --ring-hole: #14171F;
    --note: #4A4322;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
    --focus: #8FB4F0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
    min-height: 100vh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  code, .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; }
  code { background: var(--paper-deep); padding: 0 5px; border-radius: 4px; }
  mark { background: var(--hl); color: var(--hl-ink); padding: 0 3px; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hand { font-family: "Gaegu", "Gowun Dodum", sans-serif; }
  .serif { font-family: "Gowun Batang", "Gowun Dodum", serif; }

  /* ---------- desk + book ---------- */
  .desk {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 14px 44px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .topbar .brand { font-family: "Gaegu", sans-serif; font-size: 22px; color: var(--ink); font-weight: 700; }
  .topbar .status { font-size: 13px; display: flex; gap: 10px; align-items: center; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
  .dot.on { background: var(--correct); }

  .book {
    position: relative;
    display: grid;
    grid-template-columns: 44px 1fr;
    min-height: 620px;
  }
  .binding {
    position: relative;
    background: var(--paper-deep);
    border-radius: 14px 0 0 14px;
    box-shadow: var(--shadow);
  }
  .binding::before {
    content: "";
    position: absolute;
    inset: 24px 0 24px 0;
    background:
      radial-gradient(circle at 50% 50%, var(--ring-hole) 0 5px, transparent 6px) 0 0 / 100% 46px repeat-y;
  }
  .binding::after {
    content: "";
    position: absolute;
    left: 14px; right: 14px; top: 24px; bottom: 24px;
    background: repeating-linear-gradient(to bottom, transparent 0 14px, var(--ring) 14px 26px, transparent 26px 46px);
    border-radius: 6px;
    opacity: 0.9;
    pointer-events: none;
  }

  .page {
    position: relative;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 100%,
      var(--paper);
    border-radius: 0 14px 14px 0;
    box-shadow: var(--shadow);
    padding: 44px 56px 48px 40px;
    overflow: hidden;
  }
  .page.flip { animation: flip 260ms ease-out; }
  @keyframes flip {
    from { opacity: 0.3; transform: translateX(14px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .page.flip { animation: none; } }

  .washi {
    position: absolute;
    top: -6px;
    left: 44%;
    width: 130px;
    height: 26px;
    transform: rotate(-3deg);
    background: repeating-linear-gradient(135deg, var(--pink) 0 8px, color-mix(in srgb, var(--pink) 60%, var(--paper)) 8px 16px);
    opacity: 0.85;
    border-radius: 2px;
  }
  .washi.blue { background: repeating-linear-gradient(135deg, var(--sky) 0 8px, color-mix(in srgb, var(--sky) 60%, var(--paper)) 8px 16px); }
  .washi.green { background: repeating-linear-gradient(135deg, var(--sage) 0 8px, color-mix(in srgb, var(--sage) 60%, var(--paper)) 8px 16px); }
  .washi.purple { background: repeating-linear-gradient(135deg, var(--lavender) 0 8px, color-mix(in srgb, var(--lavender) 60%, var(--paper)) 8px 16px); }

  /* ---------- index tabs ---------- */
  .tabs {
    position: absolute;
    right: -2px;
    top: 40px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transform: translateX(100%);
    z-index: 2;
  }
  .tab {
    writing-mode: vertical-rl;
    border: none;
    padding: 14px 8px;
    border-radius: 0 10px 10px 0;
    font-family: "Gaegu", sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    background: var(--paper-deep);
    box-shadow: 4px 4px 12px rgba(0,0,0,0.08);
    letter-spacing: 0.08em;
    opacity: 0.8;
  }
  .tab.pink { background: var(--pink); }
  .tab.sage { background: var(--sage); }
  .tab.sky { background: var(--sky); }
  .tab.lavender { background: var(--lavender); }
  .tab.active, .tab:hover { opacity: 1; transform: translateX(3px); }

  /* ---------- page furniture ---------- */
  .eyebrow {
    font-family: "Gaegu", sans-serif;
    font-size: 17px;
    color: var(--ink-soft);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .chip {
    display: inline-block;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 14px;
    line-height: 1.7;
    background: var(--paper-deep);
    color: var(--ink-soft);
    font-family: "Gowun Dodum", sans-serif;
  }
  h1.title {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: clamp(22px, 3vw, 28px);
    line-height: 1.35;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  h2.sec {
    font-family: "Gaegu", sans-serif;
    font-size: 21px;
    font-weight: 700;
    margin: 28px 0 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .prose { max-width: 62ch; }
  .prose p { margin: 0 0 10px; }
  .prose ul { margin: 0 0 10px; padding-left: 20px; }
  .prose li { margin: 0 0 4px; }
  .prose h3 { font-family: "Gaegu", sans-serif; font-size: 20px; margin: 22px 0 6px; }
  .prose table { border-collapse: collapse; font-size: 15px; margin: 6px 0 12px; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
  .prose th { background: var(--paper-deep); font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  .sub {
    display: block;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.55;
    margin: 2px 0 0;
    font-family: "Gowun Dodum", sans-serif;
  }
  .prose p .sub, .prose li .sub { margin-top: 1px; }
  .subtitle {
    font-family: "Gaegu", sans-serif;
    font-size: 19px;
    color: var(--ink-soft);
    margin: -12px 0 18px;
  }
  .summary {
    background: color-mix(in srgb, var(--sky) 22%, var(--paper));
    border-left: 3px solid var(--sky);
    padding: 8px 14px;
    border-radius: 0 10px 10px 0;
    margin: 0 0 14px;
    max-width: 62ch;
    font-size: 15px;
  }
  .summary .lbl { font-family: "Gaegu", sans-serif; font-size: 17px; color: var(--ink-soft); margin-right: 6px; }

  /* ---------- options ---------- */
  .options { display: grid; gap: 10px; margin: 8px 0 4px; }
  .opt {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 10px;
    align-items: start;
    text-align: left;
    padding: 12px 14px;
    background: color-mix(in srgb, var(--paper) 70%, transparent);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    transition: border-color 120ms, background 120ms;
  }
  .opt:hover:not([disabled]) { border-color: var(--ink-faint); }
  .opt .key {
    font-family: "Gaegu", sans-serif;
    font-size: 20px;
    font-weight: 700;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-faint);
    display: grid; place-items: center;
    line-height: 1;
  }
  .opt .txt .en { display: block; }
  .opt .txt .sub { font-size: 13.5px; }
  .opt.chosen { border-color: var(--ink); }
  .opt.right { border-color: var(--correct); background: color-mix(in srgb, var(--sage) 30%, var(--paper)); }
  .opt.right .key { background: var(--correct); color: #fff; border-color: var(--correct); }
  .opt.wrongpick { border-color: var(--wrong); background: color-mix(in srgb, var(--coral) 22%, var(--paper)); }
  .opt.wrongpick .key { background: var(--wrong); color: #fff; border-color: var(--wrong); }
  .opt[disabled] { cursor: default; }

  .verdict {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 14px 0 4px;
    min-height: 44px;
  }
  .stamp {
    font-family: "Gaegu", sans-serif;
    font-size: 22px;
    font-weight: 700;
    padding: 2px 14px;
    border: 2.5px solid currentColor;
    border-radius: 12px;
    transform: rotate(-6deg);
    letter-spacing: 0.06em;
    opacity: 0.9;
  }
  .stamp.ok { color: var(--correct); }
  .stamp.no { color: var(--wrong); }
  .verdict .why { color: var(--ink-soft); font-size: 15px; }

  .reveal { display: none; }
  .reveal.open { display: block; }
  .traps li { margin-bottom: 6px; }
  .traps b { font-family: "Gaegu", sans-serif; font-size: 18px; font-weight: 700; margin-right: 4px; }
  .keypoints {
    background: var(--note);
    border-radius: 4px 14px 4px 14px;
    padding: 14px 18px;
    margin: 12px 0 4px;
    transform: rotate(0.4deg);
    box-shadow: 2px 3px 8px rgba(0,0,0,0.08);
    max-width: 62ch;
  }
  .keypoints .lbl { font-family: "Gaegu", sans-serif; font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .keypoints ul { margin: 0; padding-left: 18px; }

  /* ---------- my note ---------- */
  .mynote {
    margin-top: 24px;
    display: grid;
    gap: 10px;
  }
  textarea.note {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--line) 27px 28px);
    line-height: 28px;
    padding: 0 4px;
    font-family: "Gaegu", sans-serif;
    font-size: 19px;
  }
  textarea.note::placeholder { color: var(--ink-faint); }
  .saved { font-size: 13px; color: var(--ink-faint); min-height: 18px; }

  /* ---------- footer nav ---------- */
  .pager {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 36px 0 0;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    color: var(--ink-soft);
    font-size: 14px;
  }
  .pager button {
    border: none;
    background: transparent;
    font-family: "Gaegu", sans-serif;
    font-size: 19px;
    color: var(--ink);
    padding: 4px 8px;
  }
  .pager button[disabled] { color: var(--ink-faint); cursor: default; }
  .pnum { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ---------- table of contents ---------- */
  .toc { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 4px; }
  .sechead { font-family: "Gaegu", sans-serif; font-size: 20px; font-weight: 700; margin: 18px 0 4px; display: flex; align-items: center; gap: 10px; }
  .sechead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .toc .sum { grid-column: 2 / -1; font-size: 13.5px; color: var(--ink-soft); margin-top: -2px; }
  .toc li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 6px; border-bottom: 1px dotted var(--line); }
  .toc li button { border: none; background: none; text-align: left; padding: 0; line-height: 1.5; }
  .toc li button:hover { text-decoration: underline; }
  .toc .n { font-family: "IBM Plex Mono", monospace; color: var(--ink-faint); font-size: 13px; }
  .toc .st { font-family: "Gaegu", sans-serif; font-size: 16px; }
  .st.ok { color: var(--correct); } .st.no { color: var(--wrong); } .st.todo { color: var(--ink-faint); }
  .st.lesson { color: var(--ink-soft); }
  .toc .dom { font-size: 13px; color: var(--ink-soft); margin-left: 6px; }

  /* ---------- progress ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 10px 0 20px; max-width: 520px; }
  .stat { text-align: center; padding: 12px 8px; border: 1.5px solid var(--line); border-radius: 12px; }
  .stat .big { font-family: "Gowun Batang", serif; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .lbl { font-family: "Gaegu", sans-serif; font-size: 17px; color: var(--ink-soft); }
  .bar { height: 12px; background: var(--paper-deep); border-radius: 999px; overflow: hidden; max-width: 520px; }
  .bar i { display: block; height: 100%; background: var(--sage); }
  .domains { display: grid; gap: 6px; margin-top: 16px; max-width: 520px; }
  .domains div { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .domains .bar { height: 8px; }

  .empty { color: var(--ink-soft); padding: 20px 0; }
  .notice {
    margin: 0 0 14px 44px;
    padding: 8px 14px;
    background: color-mix(in srgb, var(--coral) 20%, var(--paper));
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  .notice.open { display: block; }

  @media (max-width: 720px) {
    .desk { padding: 16px 8px 40px; }
    .book { grid-template-columns: 26px 1fr; }
    .page { padding: 34px 22px 32px 18px; border-radius: 0 10px 10px 0; }
    .tabs { transform: none; right: 0; top: auto; bottom: -46px; flex-direction: row; left: 0; justify-content: center; }
    .tab { writing-mode: horizontal-tb; padding: 6px 12px; border-radius: 10px 10px 0 0; font-size: 15px; }
    .desk { padding-bottom: 80px; }
    .topbar, .notice { margin-left: 0; }
    .washi { width: 90px; left: 50%; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .domains div { grid-template-columns: 96px 1fr auto; }
  }

  /* ---------- cover ---------- */
  .cover {
    min-height: 560px;
    display: grid;
    align-content: center;
    justify-items: center;
    text-align: center;
    gap: 18px;
    padding: 20px 0;
  }
  .cover .frame {
    border: 2px solid var(--ink);
    outline: 1px solid var(--ink);
    outline-offset: 5px;
    padding: 34px 44px 30px;
    max-width: 520px;
    background: color-mix(in srgb, var(--paper) 85%, transparent);
    position: relative;
  }
  .cover .kicker { font-family: "Gaegu", sans-serif; font-size: 18px; letter-spacing: 0.2em; color: var(--ink-soft); }
  .cover h1 { font-family: "Gowun Batang", serif; font-size: clamp(30px, 5vw, 44px); font-weight: 700; margin: 6px 0 4px; line-height: 1.2; }
  .cover .full { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--ink-soft); letter-spacing: 0.04em; }
  .cover .owner { margin-top: 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; text-align: left; font-family: "Gaegu", sans-serif; font-size: 19px; }
  .cover .owner span:nth-child(odd) { color: var(--ink-soft); }
  .cover .owner span:nth-child(even) { border-bottom: 1px solid var(--line); min-width: 160px; }
  .cover .sticker {
    position: absolute; right: -26px; top: -22px;
    background: var(--pink); color: var(--ink);
    font-family: "Gaegu", sans-serif; font-weight: 700; font-size: 17px; line-height: 1.25;
    padding: 12px 14px; border-radius: 50%; transform: rotate(8deg);
    box-shadow: 2px 3px 8px rgba(0,0,0,0.12); text-align: center; min-width: 88px;
  }
  :root[data-theme="dark"] .cover .sticker { color: var(--paper); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cover .sticker { color: var(--paper); } }
  .legend { display: grid; gap: 6px; max-width: 520px; text-align: left; font-size: 14.5px; margin-top: 8px; }
  .legend div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: baseline; }
  .legend b { font-family: "Gaegu", sans-serif; font-size: 18px; font-weight: 700; }
  .legend .tag { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* ---------- lectures ---------- */
  .lecture-list { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 6px; }
  .lecture-list li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 8px; border-bottom: 1px dotted var(--line); }
  .lecture-list button.open { border: none; background: none; text-align: left; padding: 0; line-height: 1.5; }
  .lecture-list button.open:hover { text-decoration: underline; }
  .lecture-list .meta { font-size: 13px; color: var(--ink-soft); }
  .lecture-list .ko { font-family: "Gaegu", sans-serif; font-size: 16px; }
  .lecture-list .ko.yes { color: var(--correct); } .lecture-list .ko.no { color: var(--ink-faint); }
  .form { display: grid; gap: 12px; max-width: 640px; }
  .form label { display: grid; gap: 4px; font-size: 14px; color: var(--ink-soft); }
  .form input, .form textarea {
    padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px;
    background: color-mix(in srgb, var(--paper) 70%, transparent); color: var(--ink);
  }
  .form textarea { min-height: 160px; resize: vertical; font-size: 14px; line-height: 1.5; }
  .form .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form .hint { font-size: 13px; color: var(--ink-faint); }
  .err { color: var(--wrong); font-size: 14px; min-height: 18px; }
  .para { max-width: 66ch; margin: 0 0 14px; }
  .para .en { display: block; }
  .para .sub { font-size: 14.5px; }
  .toolrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 14px; }
  .working { font-family: "Gaegu", sans-serif; font-size: 17px; color: var(--ink-soft); }

  .crumb { font-family: "Gaegu", sans-serif; font-size: 18px; color: var(--ink-soft); margin-bottom: 2px; }
  .crumb button { border: none; background: none; padding: 0; font: inherit; color: var(--ink-soft); text-decoration: underline; }
  .statusline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; font-size: 14px; color: var(--ink-soft); }
  .pill { display: inline-block; padding: 0 10px; border-radius: 999px; font-family: "Gaegu", sans-serif; font-size: 16px; font-weight: 700; line-height: 1.6; }
  .pill.run { background: color-mix(in srgb, var(--hl) 60%, var(--paper)); color: var(--hl-ink); }
  .pill.done { background: color-mix(in srgb, var(--sage) 45%, var(--paper)); color: var(--correct); }
  .pill.none { background: var(--paper-deep); color: var(--ink-faint); }
  .pill.fail { background: color-mix(in srgb, var(--coral) 30%, var(--paper)); color: var(--wrong); }
  .progress { height: 8px; background: var(--paper-deep); border-radius: 999px; overflow: hidden; max-width: 420px; flex: 1; min-width: 120px; }
  .progress i { display: block; height: 100%; background: var(--sky); transition: width 300ms; }
  .lecture-list li { grid-template-columns: 1fr auto; }
  .lecture-list .title { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 17px; }
  .newbtn { margin: 0 0 12px; }
  .topbar .task { font-family: "Gaegu", sans-serif; font-size: 16px; color: var(--ink); background: color-mix(in srgb, var(--hl) 60%, var(--paper)); padding: 0 10px; border-radius: 999px; display: none; }
  .topbar .task.on { display: inline-block; }
  .para { margin: 0 0 18px; }
  .para .sub { margin-top: 4px; }

  .divider { min-height: 520px; display: grid; align-content: center; gap: 14px; padding: 10px 0; }
  .divider .secno { font-family: "Gaegu", sans-serif; font-size: 20px; letter-spacing: 0.18em; color: var(--ink-soft); }
  .divider h1 { font-family: "Gowun Batang", serif; font-size: clamp(26px, 4vw, 36px); font-weight: 700; margin: 0; line-height: 1.25; text-wrap: balance; }
  .divider .lect { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; max-width: 560px; }
  .divider .lect li { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .divider .lect .no { font-family: "IBM Plex Mono", monospace; color: var(--ink-faint); font-size: 13px; }
  .divider .lect button { border: none; background: none; text-align: left; padding: 0; font: inherit; line-height: 1.5; }
  .divider .lect button:hover { text-decoration: underline; }
  .divider .lect .cnt { font-family: "Gaegu", sans-serif; font-size: 15px; color: var(--ink-soft); }
  .lecthead { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: baseline; margin: 14px 0 2px; }
  .lecthead .no { font-family: "IBM Plex Mono", monospace; color: var(--ink-faint); font-size: 13px; }
  .lecthead .t { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 16px; }
  .lecthead .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .lnk { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 0 10px; font-family: "Gaegu", sans-serif; font-size: 15px; line-height: 1.7; color: var(--ink); }
  .lnk.ok { border-color: var(--sage); } .lnk.no { border-color: var(--wrong); } .lnk.todo { color: var(--ink-soft); }
  .lnk:hover { background: var(--paper-deep); }
  .toc.inlect { margin: 0 0 6px 54px; }
</style>

<div class="desk">
  <div class="topbar">
    <span class="brand">미지의 CCAF 노트</span>
    <span class="status"><span class="task" id="taskmsg"></span><span class="dot" id="dbdot"></span><span id="dbmsg">저장 준비 중</span></span>
  </div>

  <div class="book">
    <div class="binding" aria-hidden="true"></div>
    <div class="page" id="page"></div>
    <nav class="tabs" aria-label="구역">
      <button class="tab pink" data-view="cover" title="노트 표지">표지</button>
      <button class="tab sky" data-view="toc" title="섹션별 강의 노트와 문제 목차">차례</button>
      <button class="tab lavender" data-view="study" title="강의 노트와 문제를 한 장씩 넘기며 공부">한 장씩 공부</button>
      <button class="tab sage" data-view="wrong" title="틀린 문제만 모아 다시 풀기">틀린 문제</button>
      <button class="tab" data-view="lectures" title="영어 대본을 붙여 넣고 한국어 번역·요약을 만들어 저장">인강 듣기</button>
    </nav>
  </div>
</div>

<script id="pages-data" type="application/json">/*__PAGES__*/</script>
<script id="course-data" type="application/json">/*__COURSE__*/</script>
<script>
(() => {
  'use strict';

  const DOMAINS = ['모델 선택', '프롬프트·평가', '툴·에이전트 루프', '지식·RAG', '멀티에이전트', 'Claude Code', '신뢰성'];
  const OWNER = { name: '박미지', course: 'Claude Certified Architect - Foundations', started: '2026. 09' };
  const state = {
    db: null, sample: null,
    pages: [],          // content pages (questions + lesson notes)
    progress: {},
    lectures: [],       // saved transcripts
    view: 'study',      // study | wrong | lectures | lecture
    idx: 0,             // index into book(): 0 cover, 1 toc, 2.. pages
    lectureId: null,
  };
  const LS = { progress: 'ccaf-notes-progress', lectures: 'ccaf-notes-lectures' };

  const $ = (sel, root = document) => root.querySelector(sel);
  const pageEl = $('#page');

  try { state.pages = JSON.parse($('#pages-data').textContent); } catch { state.pages = []; }
  let course = { sections: [] };
  try { course = JSON.parse($('#course-data').textContent) || course; } catch {}
  state.pages.sort((a, b) => (a.order || 0) - (b.order || 0));

  // Course outline: sections in order, each lecture with its note pages and quiz pages.
  function outline() {
    const used = new Set();
    const secs = course.sections.map((sec, si) => {
      const lectures = (sec.lectures || []).map(lec => {
        const mine = state.pages.filter(p => p.section === sec.title && String(p.lecture || '') === String(lec.no));
        mine.forEach(p => used.add(p.id));
        return { no: String(lec.no), title: lec.title, notes: mine.filter(p => p.kind === 'lesson'), quiz: mine.filter(p => p.kind !== 'lesson'),
                 transcript: state.lectures.find(l => String(l.lecture || (l.title.match(/^(\d+)[.)]/) || [])[1] || '') === String(lec.no)) };
      });
      const loose = state.pages.filter(p => p.section === sec.title && !used.has(p.id));
      loose.forEach(p => used.add(p.id));
      return { no: si + 1, title: sec.title, lectures, loose };
    });
    const rest = state.pages.filter(p => !used.has(p.id));
    if (rest.length) secs.push({ no: secs.length + 1, title: 'Unsorted', unsorted: true, lectures: [], loose: rest });
    return secs;
  }
  function book() {
    const out = [{ kind: 'cover', id: '_cover' }, { kind: 'toc', id: '_toc' }];
    for (const sec of outline()) {
      out.push({ kind: 'divider', id: '_sec-' + sec.no, sec });
      for (const lec of sec.lectures) {
        lec.notes.forEach(p => out.push(Object.assign(p, { _sec: sec, _lec: lec })));
        lec.quiz.forEach((p, i) => out.push(Object.assign(p, { _sec: sec, _lec: lec, _qi: i + 1, _qn: lec.quiz.length })));
      }
      const lq = sec.loose.filter(p => p.kind !== 'lesson');
      sec.loose.forEach(p => out.push(Object.assign(p, { _sec: sec, _lec: null, _qi: p.kind !== 'lesson' ? lq.indexOf(p) + 1 : 0, _qn: lq.length })));
    }
    return out;
  }
  const pageIndex = id => book().findIndex(p => p.id === id);

  // ---------- tiny markup ----------
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function inline(s) {
    return esc(s)
      .replace(/==(.+?)==/g, '<mark>$1</mark>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function bi(s) {
    const i = String(s ?? '').indexOf(' // ');
    if (i < 0) return inline(s);
    return inline(s.slice(0, i)) + '<span class="sub">' + inline(s.slice(i + 4)) + '</span>';
  }
  function md(text) {
    const lines = String(text ?? '').split('\n');
    let html = '', list = null, table = null;
    const flush = () => {
      if (list) { html += '<ul>' + list.map(l => '<li>' + bi(l) + '</li>').join('') + '</ul>'; list = null; }
      if (table) {
        const rows = table.filter(r => !/^\s*\|?\s*-{2,}/.test(r)).map(r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim()));
        const [head, ...body] = rows;
        html += '<div class="tablewrap"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
          body.map(r => '<tr>' + r.map(c => '<td>' + bi(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
        table = null;
      }
    };
    for (const raw of lines) {
      const l = raw.trimEnd();
      if (/^\s*- /.test(l)) { if (table) flush(); (list ||= []).push(l.replace(/^\s*- /, '')); continue; }
      if (/^\s*\|/.test(l)) { if (list) flush(); (table ||= []).push(l); continue; }
      flush();
      if (/^### /.test(l)) html += '<h3>' + bi(l.slice(4)) + '</h3>';
      else if (l.trim()) html += '<p>' + bi(l) + '</p>';
    }
    flush();
    return html;
  }

  // ---------- storage: db when available, else localStorage ----------
  const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  // local backend (serve.py): files in data/, translation via claude CLI
  const local = {
    ok: false, claude: false,
    async ping() {
      try { const r = await fetch('/api/ping', { cache: 'no-store' }); if (!r.ok) return false; const j = await r.json(); this.ok = !!j.ok; this.claude = !!j.claude; return this.ok; } catch { return false; }
    },
    async post(path, body) {
      const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error) throw { code: 'local', message: j.error || ('HTTP ' + r.status) };
      return j;
    },
    async load() { const r = await fetch('/api/data', { cache: 'no-store' }); return r.json(); },
  };
  function parseJsonLoose(text) {
    const tries = [text, (text.match(/```(?:json)?\s*([\s\S]*?)```/) || [])[1], text.slice(Math.min(...['[', '{'].map(c => { const i = text.indexOf(c); return i < 0 ? Infinity : i; })), Math.max(text.lastIndexOf(']'), text.lastIndexOf('}')) + 1)];
    for (const t of tries) { if (!t) continue; try { return JSON.parse(t); } catch {} }
    throw { code: 'invalid_json', message: 'JSON 을 읽지 못했어요', text };
  }
  function makeLocalSample() {
    const fn = async (prompt, opts = {}) => {
      const j = await local.post('/api/sample', { prompt, model: opts.modelTier === 'quick' ? 'haiku' : 'sonnet' });
      if (opts.onText) opts.onText({ text: j.text, delta: j.text });
      return { text: j.text, truncated: false };
    };
    fn.json = async (prompt, opts) => parseJsonLoose((await fn(prompt, opts)).text);
    return fn;
  }

  async function connect() {
    state.progress = lsGet(LS.progress, {});
    state.lectures = lsGet(LS.lectures, []);
    render();
    let db = null;
    try { db = window.claude?.use ? await claude.use('db') : null; } catch { db = null; }
    if (!db) {
      if (await local.ping()) {
        try {
          const d = await local.load();
          state.progress = d.progress || {}; state.lectures = d.lectures || [];
        } catch {}
        state.backend = 'local';
        if (local.claude) state.sample = makeLocalSample();
        $('#dbdot').classList.add('on');
        $('#dbmsg').textContent = local.claude ? '프로젝트 폴더에 저장 · Claude CLI 연결됨' : '프로젝트 폴더에 저장 · Claude CLI 없음';
        render();
        return;
      }
      $('#dbmsg').textContent = '이 브라우저에만 저장';
      return;
    }
    state.backend = 'db';
    state.db = db;
    $('#dbdot').classList.add('on');
    $('#dbmsg').textContent = '저장됨';
    db.collection('progress').onSnapshot(snap => {
      const p = {}; snap.docs.forEach(d => { p[d.id] = d.data(); }); state.progress = p;
      if (state.view === 'study') refreshStudyProgressOnly(); else render();
    });
    db.collection('lectures').orderBy('createdAt', 'asc').onSnapshot(snap => {
      state.lectures = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (state.view === 'lectures' || state.view === 'lecture') render();
    });
    try { state.sample = window.claude?.use ? await claude.use('sample') : null; } catch { state.sample = null; }
    if (state.view === 'lectures' || state.view === 'lecture') render();
  }

  const saveTimers = {};
  function saveProgress(pageId, patch) {
    state.progress[pageId] = { ...(state.progress[pageId] || {}), ...patch, studiedAt: new Date().toISOString() };
    lsSet(LS.progress, state.progress);
    if (!state.db && state.backend !== 'local') return;
    clearTimeout(saveTimers[pageId]);
    saveTimers[pageId] = setTimeout(async () => {
      try {
        if (state.db) await state.db.doc('progress/' + pageId).set(state.progress[pageId]);
        else await local.post('/api/progress', { id: pageId, data: state.progress[pageId] });
        const s = pageEl.querySelector('.saved'); if (s) s.textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        const s = pageEl.querySelector('.saved'); if (s) s.textContent = '저장 실패: ' + (e?.message || e?.code || '');
      }
    }, 500);
  }
  async function saveLecture(doc) {
    if (state.db) { await state.db.doc('lectures/' + doc.id).set(doc); return; }
    const i = state.lectures.findIndex(l => l.id === doc.id);
    if (i >= 0) state.lectures[i] = doc; else state.lectures.push(doc);
    if (state.backend === 'local') await local.post('/api/lecture', doc);
    else lsSet(LS.lectures, state.lectures);
  }
  async function deleteLecture(id) {
    if (state.db) { await state.db.doc('lectures/' + id).delete(); return; }
    state.lectures = state.lectures.filter(l => l.id !== id);
    if (state.backend === 'local') await local.post('/api/lecture/delete', { id });
    else lsSet(LS.lectures, state.lectures);
  }

  // ---------- routing ----------
  function go(view, arg) {
    state.view = view;
    if (view === 'study' && typeof arg === 'number') state.idx = arg;
    if (view === 'lecture') state.lectureId = arg;
    location.hash = view === 'study' ? '#p' + (state.idx + 1) : view === 'lecture' ? '#lecture-' + arg : '#' + view;
    render();
  }
  function readHash() {
    const h = location.hash.slice(1);
    if (/^p\d+$/.test(h)) { state.view = 'study'; state.idx = Math.max(0, parseInt(h.slice(1), 10) - 1); }
    else if (h.startsWith('lecture-')) { state.view = 'lecture'; state.lectureId = h.slice(8); }
    else if (['wrong', 'lectures'].includes(h)) state.view = h;
    else state.view = 'study';
    if (state.idx >= book().length) state.idx = book().length - 1;
  }

  // ---------- render ----------
  function render() {
    const active = state.view === 'study' ? (state.idx === 0 ? 'cover' : state.idx === 1 ? 'toc' : 'study') : state.view === 'lecture' ? 'lectures' : state.view;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === active));
    pageEl.classList.remove('flip'); void pageEl.offsetWidth; pageEl.classList.add('flip');
    if (state.view === 'study') renderStudy();
    else if (state.view === 'wrong') renderWrong();
    else if (state.view === 'lectures') renderLectures();
    else if (state.view === 'lecture') renderLecture();
  }

  function pager(i, total) {
    return `<div class="pager">
      <button data-nav="prev" ${i <= 0 ? 'disabled' : ''}>← 앞 장</button>
      <span class="pnum">${i + 1} / ${total}</span>
      <button data-nav="next" ${i >= total - 1 ? 'disabled' : ''}>다음 장 →</button>
    </div>`;
  }
  function wirePager() {
    pageEl.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go('study', state.idx + (b.dataset.nav === 'next' ? 1 : -1))));
  }
  function titleBlock(p) {
    const en = p.title_en || p.title, ko = p.title_en ? p.title : '';
    return `<h1 class="title">${esc(en)}</h1>${ko ? `<div class="subtitle">${esc(ko)}</div>` : ''}`;
  }
  function eyebrow(p, lead) {
    const bits = [`<span>${lead}</span>`];
    if (p._sec) bits.push(`<span class="chip">${p._sec.unsorted ? '섹션 미정' : 'Section ' + p._sec.no + ' · ' + esc(p._sec.title)}</span>`);
    if (p._lec) bits.push(`<span class="chip">Lecture ${esc(p._lec.no)} · ${esc(p._lec.title)}</span>`);
    if (p.domain) bits.push(`<span class="chip">${esc(p.domain)}</span>`);
    return `<div class="eyebrow">${bits.join('')}</div>`;
  }
  function kp(p) { return p.keyPoints?.length ? `<div class="keypoints"><div class="lbl">Exam points</div><ul>${p.keyPoints.map(k => '<li>' + bi(k) + '</li>').join('')}</ul></div>` : ''; }
  function qNumber(p) { let n = 0; for (const x of state.pages) { if (x.kind !== 'lesson') n++; if (x.id === p.id) return n; } return n; }

  function renderStudy() {
    const pages = book(), total = pages.length;
    const p = pages[state.idx];
    if (p.kind === 'cover') return renderCover(total);
    if (p.kind === 'toc') return renderToc(total);
    if (p.kind === 'divider') return renderDivider(p.sec, total);
    const pr = state.progress[p.id] || {};
    const washi = ['', 'blue', 'green', 'purple'][state.idx % 4];
    if (p.kind === 'lesson') {
      pageEl.innerHTML = `<div class="washi ${washi}"></div>
        ${eyebrow(p, 'Lecture note')}
        ${titleBlock(p)}
        ${p.summary ? `<div class="summary"><span class="lbl">Summary</span>${bi(p.summary)}</div>` : ''}
        <div class="prose">${md(p.body)}</div>
        ${kp(p)}
        ${noteBlock(pr)}
        ${pager(state.idx, total)}`;
    } else {
      const answered = !!pr.chosen;
      pageEl.innerHTML = `<div class="washi ${washi}"></div>
        ${eyebrow(p, p._qn ? `Quiz ${p._qi} / ${p._qn}` : 'Quiz')}
        ${titleBlock(p)}
        <div class="prose">
          <p>${p.question_en ? esc(p.question_en) : inline(p.question_ko)}${p.question_en && p.question_ko ? `<span class="sub">${inline(p.question_ko)}</span>` : ''}</p>
        </div>
        <div class="options">${(p.options || []).map(o => {
          let cls = 'opt';
          if (answered) { if (o.key === p.answer) cls += ' right'; else if (o.key === pr.chosen) cls += ' wrongpick'; }
          return `<button class="${cls}" data-opt="${esc(o.key)}" ${answered ? 'disabled' : ''}>
            <span class="key">${esc(o.key)}</span>
            <span class="txt"><span class="en">${o.en ? esc(o.en) : inline(o.ko)}</span>${o.en && o.ko ? `<span class="sub">${inline(o.ko)}</span>` : ''}</span></button>`;
        }).join('')}</div>
        <div class="verdict">${answered ? (pr.correct
          ? `<span class="stamp ok">정답!</span><span class="why">고른 답: ${esc(pr.chosen)}</span>`
          : `<span class="stamp no">다시</span><span class="why">고른 답 ${esc(pr.chosen)}, 정답은 ${esc(p.answer)}</span>`) : '<span class="why hand" style="font-size:18px">보기를 고르면 풀이가 펼쳐져요</span>'}
          ${answered ? '<button class="btn ghost" data-retry style="margin-left:auto">다시 풀기</button>' : ''}</div>
        <div class="reveal ${answered ? 'open' : ''}">
          <h2 class="sec">Why this answer</h2>
          <div class="prose">${md(p.explanation)}</div>
          ${p.traps?.length ? `<h2 class="sec">Traps</h2><ul class="traps prose">${p.traps.map(t => `<li><b>${esc(t.key)}</b> ${bi(t.why)}</li>`).join('')}</ul>` : ''}
          ${kp(p)}
          ${noteBlock(pr)}
        </div>
        ${pager(state.idx, total)}`;
      pageEl.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
        const chosen = b.dataset.opt;
        saveProgress(p.id, { chosen, correct: chosen === p.answer });
        renderStudy();
      }));
      const retry = pageEl.querySelector('[data-retry]');
      if (retry) retry.addEventListener('click', () => { saveProgress(p.id, { chosen: null, correct: null }); renderStudy(); });
    }
    const ta = pageEl.querySelector('textarea.note');
    if (ta) ta.addEventListener('input', () => saveProgress(p.id, { note: ta.value }));
    wirePager();
  }

  function noteBlock(pr) {
    return `<div class="mynote">
      <textarea class="note" placeholder="내 말로 정리해 보기. 헷갈린 단어, 외울 문장, 다음에 볼 것.">${esc(pr.note || '')}</textarea>
      <div class="saved">${pr.studiedAt ? '마지막 공부 ' + new Date(pr.studiedAt).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}</div>
    </div>`;
  }
  function refreshStudyProgressOnly() {
    const p = book()[state.idx]; if (!p) return;
    const pr = state.progress[p.id] || {};
    const ta = pageEl.querySelector('textarea.note');
    if (ta && document.activeElement !== ta && ta.value !== (pr.note || '')) ta.value = pr.note || '';
    if (p.kind === 'cover' || p.kind === 'toc') render();
  }

  // ---------- cover ----------
  function renderCover(total) {
    const qs = state.pages.filter(p => p.kind !== 'lesson');
    const done = qs.filter(p => state.progress[p.id]?.chosen);
    const right = done.filter(p => state.progress[p.id]?.correct);
    const notes = state.pages.filter(p => p.kind === 'lesson').length;
    pageEl.innerHTML = `<div class="washi"></div>
      <div class="cover">
        <div class="frame">
          <div class="sticker">문제 ${done.length}/${qs.length}<br><span style="font-size:14px">정답 ${right.length}</span></div>
          <div class="kicker">STUDY NOTEBOOK</div>
          <h1>미지의 CCAF 노트</h1>
          <div class="full">${esc(OWNER.course)}</div>
          <div class="owner">
            <span>이름</span><span>${esc(OWNER.name)}</span>
            <span>시작</span><span>${esc(OWNER.started)}</span>
            <span>내용</span><span>섹션 ${course.sections.length} · 노트 ${notes}장 · 문제 ${qs.length}장 · 대본 ${state.lectures.length}편</span>
          </div>
        </div>
        <div class="legend">
          <div><b><i class="tag" style="background:var(--sky)"></i>차례</b><span>섹션별로 강의 노트와 문제를 한눈에 보고 바로 펼친다.</span></div>
          <div><b><i class="tag" style="background:var(--lavender)"></i>한 장씩 공부</b><span>강의 노트를 읽고 문제를 풀며 한 장씩 넘긴다. 메모는 자동 저장.</span></div>
          <div><b><i class="tag" style="background:var(--sage)"></i>틀린 문제</b><span>틀린 문제만 모아 다시 푼다.</span></div>
          <div><b><i class="tag" style="background:var(--paper-deep);border:1px solid var(--line)"></i>인강 듣기</b><span>영어 대본을 붙여 넣으면 Claude 가 문단마다 한국어 번역을 달고 요약을 만들어 저장한다.</span></div>
        </div>
      </div>
      ${pager(state.idx, total)}`;
    wirePager();
  }

  // ---------- toc / wrong ----------
  function statusOf(p) {
    const pr = state.progress[p.id];
    if (p.kind === 'lesson') return pr?.studiedAt ? ['lesson', '읽음'] : ['todo', '아직'];
    if (!pr?.chosen) return ['todo', '아직'];
    return pr.correct ? ['ok', '정답'] : ['no', '오답'];
  }
  function tocRows(items) {
    const all = book();
    return `<ul class="toc">${items.map(p => {
      const [cls, lbl] = statusOf(p); const i = all.indexOf(p);
      return `<li><span class="n">${String(i + 1).padStart(2, '0')}</span>
        <button data-jump="${i}">${esc(p.title_en || p.title)}<span class="dom">${p._lec ? 'Lecture ' + esc(p._lec.no) + ' · ' : ''}${p.kind === 'lesson' ? '노트' : '문제'}</span></button>
        <span class="st ${cls}">${lbl}</span>
        ${p.kind === 'lesson' && p.summary ? `<span class="sum">${bi(p.summary)}</span>` : ''}</li>`;
    }).join('')}</ul>`;
  }
  function tocList(items) {
    if (!items.length) return '<p class="empty">여기 들어갈 장이 아직 없어요.</p>';
    return tocRows(items);
  }
  function wireJumps() {
    pageEl.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => go('study', Number(b.dataset.jump))));
    pageEl.querySelectorAll('[data-jump-id]').forEach(b => b.addEventListener('click', () => go('study', pageIndex(b.dataset.jumpId))));
    pageEl.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => go('lecture', b.dataset.open)));
  }

  function renderDivider(sec, total) {
    pageEl.innerHTML = `<div class="washi green"></div>
      <div class="divider">
        <div class="secno">${sec.unsorted ? 'UNSORTED' : 'SECTION ' + sec.no}</div>
        <h1>${esc(sec.title)}</h1>
        ${sec.unsorted ? '<p class="empty" style="padding:0">아직 어느 강의에 속하는지 정하지 않은 장이에요. course.json 에 섹션과 강의를 적으면 제자리로 갑니다.</p>' : ''}
        <ul class="lect">${sec.lectures.map(lec => {
          const first = lec.notes[0] || lec.quiz[0];
          const cnt = [lec.notes.length ? '노트' : '', lec.quiz.length ? '문제 ' + lec.quiz.length : '', lec.transcript ? '대본' : ''].filter(Boolean).join(' · ') || '아직 없음';
          return `<li><span class="no">${esc(lec.no)}</span>${first ? `<button data-jump-id="${esc(first.id)}">${esc(lec.title)}</button>` : lec.transcript ? `<button data-open="${esc(lec.transcript.id)}">${esc(lec.title)}</button>` : `<span style="color:var(--ink-faint)">${esc(lec.title)}</span>`}<span class="cnt">${cnt}</span></li>`; }).join('')}
        ${sec.loose.map(p => `<li><span class="no">·</span><button data-jump-id="${esc(p.id)}">${esc(p.title_en || p.title)}</button><span class="cnt">${p.kind === 'lesson' ? '노트' : '문제'}</span></li>`).join('')}</ul>
      </div>${pager(state.idx, total)}`;
    wireJumps(); wirePager();
  }
  function lecRow(lec) {
    const st = p => { const [c, l] = statusOf(p); return { ok: 'ok', no: 'no', todo: 'todo', lesson: 'ok' }[c] + '" title="' + l; };
    const links = [
      ...lec.notes.map(p => `<button class="lnk ${st(p)}" data-jump-id="${esc(p.id)}">노트</button>`),
      ...lec.quiz.map((p, i) => `<button class="lnk ${st(p)}" data-jump-id="${esc(p.id)}">문제 ${i + 1}</button>`),
      lec.transcript ? `<button class="lnk ${lec.transcript.paragraphs_ko?.length ? 'ok' : 'todo'}" data-open="${esc(lec.transcript.id)}">대본${lec.transcript.paragraphs_ko?.length ? ' · 한국어' : ''}</button>` : '',
    ].filter(Boolean).join('');
    return `<div class="lecthead"><span class="no">${esc(lec.no)}</span><div><span class="t">${esc(lec.title)}</span><div class="links">${links || '<span class="hint" style="font-size:13px;color:var(--ink-faint)">아직 아무것도 없음</span>'}</div></div></div>`;
  }
  function renderToc(total) {
    const secs = outline();
    pageEl.innerHTML = `<div class="washi blue"></div><div class="eyebrow">Contents</div><h1 class="title">Course index</h1><div class="subtitle">섹션 → 강의 순서. 강의마다 노트 · 문제 · 대본을 바로 열 수 있어요.</div>
      ${secs.map(sec => `<div class="sechead">${sec.unsorted ? '섹션 미정' : 'Section ' + sec.no + ' · ' + esc(sec.title)}</div>
        ${sec.lectures.map(lecRow).join('')}
        ${sec.loose.length ? tocRows(sec.loose) : ''}`).join('')}
      ${pager(state.idx, total)}`;
    wireJumps(); wirePager();
  }
  function renderWrong() {
    const items = state.pages.filter(p => { const pr = state.progress[p.id]; return pr && pr.chosen && !pr.correct; });
    pageEl.innerHTML = `<div class="washi green"></div><div class="eyebrow">Wrong answers</div><h1 class="title">틀린 문제</h1>
      <div class="subtitle">틀린 문제가 모여요. 장을 열어 "다시 풀기"를 누르면 다시 풀 수 있어요.</div>
      ${tocList(items)}`;
    wireJumps();
  }

  // ---------- lectures ----------
  const fixTranscript = t => t.replace(/\bClod\b/g, 'Claude').replace(/\bclod\b/g, 'Claude').replace(/\r/g, '');
  // Udemy transcripts arrive one caption cue per line; merge cues into readable paragraphs (~450 chars),
  // breaking preferably at sentence ends.
  function splitParagraphs(t) {
    const cues = t.split(/\n+/).map(x => x.trim()).filter(Boolean);
    const out = []; let cur = '';
    for (const c of cues) {
      const next = cur ? cur + ' ' + c : c;
      if (cur && next.length > 450 && /[.!?]["')\]]*$/.test(cur)) { out.push(cur); cur = c; }
      else if (next.length > 700) { out.push(cur || c); cur = cur ? c : ''; }
      else cur = next;
    }
    if (cur) out.push(cur);
    return out;
  }
  const tasks = {};   // lectureId -> {done, total, error}
  function taskBadge() {
    const running = Object.entries(tasks).filter(([, t]) => !t.error && t.done < t.total);
    const el = $('#taskmsg');
    if (!running.length) { el.classList.remove('on'); el.textContent = ''; return; }
    const [id, t] = running[0];
    const l = state.lectures.find(x => x.id === id);
    el.textContent = `번역 중 ${t.done}/${t.total} · ${l ? l.title : ''}`;
    el.classList.add('on');
  }
  function lectureStatus(l) {
    const t = tasks[l.id];
    if (t && t.error) return ['fail', '번역 실패 · 다시 시도'];
    if (t && t.done < t.total) return ['run', `번역 중 ${t.done}/${t.total}`];
    const n = (l.paragraphs || []).length, k = (l.paragraphs_ko || []).filter(Boolean).length;
    if (n && k === n) return ['done', l.summary ? '한국어 완료' : '한국어 완료 · 요약 없음'];
    if (k) return ['run', `한국어 ${k}/${n}`];
    return ['none', '영어만'];
  }

  async function translateLecture(id) {
    const l = state.lectures.find(x => x.id === id);
    if (!l || !state.sample) return;
    const paras = l.paragraphs || [];
    const ko = (l.paragraphs_ko || []).slice(0, paras.length); while (ko.length < paras.length) ko.push('');
    const total = paras.length + 1;  // +1 for summary
    tasks[id] = { done: ko.filter(Boolean).length, total, error: null };
    taskBadge(); if (state.view === 'lecture' && state.lectureId === id) renderLecture();
    const BATCH = 6;
    try {
      for (let s = 0; s < paras.length; s += BATCH) {
        if (paras.slice(s, s + BATCH).every((_, i) => ko[s + i])) continue;
        const chunk = paras.slice(s, s + BATCH);
        const r = await state.sample.json(
`너는 Claude Certified Architect - Foundations 강의를 듣는 한국인 학습자를 돕는 번역가다. 아래 영어 강의 문단들을 자연스러운 한국어로 번역하라. 기술 용어·API 이름·식별자(tool_use, tool_choice, enum, JSON 등)는 영어 그대로 두고, 필요하면 괄호로 짧게 풀어 준다. 문단 수와 순서를 정확히 유지하라. 반드시 JSON 배열 하나만 답하라: ["문단1 번역", "문단2 번역", ...]

${chunk.map((p, i) => `[${i + 1}]\n${p}`).join('\n\n')}`, { modelTier: 'quick' });
        if (!Array.isArray(r) || r.length !== chunk.length) throw { code: 'invalid_json', message: '문단 수가 맞지 않아요' };
        r.forEach((t, i) => { ko[s + i] = String(t); });
        const cur = state.lectures.find(x => x.id === id); if (!cur) return;
        Object.assign(cur, { paragraphs_ko: ko.slice() });
        await saveLecture({ ...cur });
        tasks[id].done = ko.filter(Boolean).length; taskBadge();
        if (state.view === 'lecture' && state.lectureId === id) renderLectureBodyOnly(cur);
        else if (state.view === 'lectures') renderLectures();
      }
      if (!l.summary) {
        const sum = await state.sample(
`아래 강의 대본을 두 문장으로 요약하라. 첫 줄은 영어 요약, 그다음 " // " 를 붙이고 한국어 요약. 형식 예: "Tool use with a JSON schema gives schema-compliant output. // 툴 사용과 JSON 스키마로 스키마를 따르는 출력을 얻는다." 다른 말은 쓰지 마라.

${paras.join('\n\n').slice(0, 30000)}`, { modelTier: 'quick' });
        const cur = state.lectures.find(x => x.id === id); if (!cur) return;
        Object.assign(cur, { summary: sum.text.trim().replace(/\n+/g, ' ') });
        await saveLecture({ ...cur });
      }
      tasks[id].done = total; taskBadge();
    } catch (e) {
      tasks[id].error = e?.code === 'not_granted' ? '이 화면에서는 Claude 를 쓸 수 없어요.' : e?.code === 'rate_limited' ? '잠시 후 다시 눌러 주세요.' : e?.code === 'invalid_json' ? '번역 결과를 읽지 못했어요. 다시 시도해 주세요.' : (e?.message || e?.code || '실패');
      taskBadge();
    }
    if (state.view === 'lecture' && state.lectureId === id) renderLecture();
    else if (state.view === 'lectures') renderLectures();
  }

  function renderLectures(openForm) {
    const list = state.lectures.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const showForm = openForm || !list.length;
    pageEl.innerHTML = `<div class="washi purple"></div><div class="eyebrow">Lectures</div><h1 class="title">인강 듣기</h1>
      <div class="subtitle">대본을 붙여 넣으면 저장과 동시에 한국어 번역이 시작돼요. 저장한 강의는 아래 목록에 남아요.</div>
      <div class="newbtn"><button class="btn" data-toggle-form>${showForm ? '목록만 보기' : '+ 새 강의 붙여 넣기'}</button></div>
      <form class="form" data-new ${showForm ? '' : 'hidden'}>
        <div class="row">
          <label>섹션<input name="section" placeholder="예: Reliable Prompts & Structured Output" style="min-width:280px" value="${esc(list[0]?.section || '')}"></label>
          <label>강의 번호<input name="lecture" placeholder="23" style="width:90px"></label>
          <label>강의 제목<input name="title" placeholder="예: JSON and Schemas for Non-Programmers" style="min-width:280px" required></label>
        </div>
        <label>영어 대본 (Udemy Transcript 를 그대로)<textarea name="transcript" required></textarea></label>
        <div class="err" data-err></div>
        <div class="row">
          <button class="btn" type="submit">저장하고 번역 시작</button>
          <span class="hint">${state.sample ? '저장하면 바로 그 강의 장이 열리고 번역이 채워져요.' : '지금은 저장만 돼요. python3 serve.py 로 열거나 claude.ai 에서 열면 번역까지 돼요.'}</span>
        </div>
      </form>
      ${list.length ? `<h2 class="sec">저장된 강의 ${list.length}편</h2><ul class="lecture-list">${list.map(l => { const [cls, lbl] = lectureStatus(l); return `<li>
        <button class="open" data-open="${esc(l.id)}"><span class="title">${l.lecture ? esc(l.lecture) + '. ' : ''}${esc(l.title)}</span><br><span class="meta">${esc(l.section || '')}${l.section ? ' · ' : ''}${new Date(l.createdAt).toLocaleDateString('ko-KR')} · ${(l.paragraphs || []).length}문단</span></button>
        <span class="pill ${cls}">${lbl}</span></li>`; }).join('')}</ul>` : ''}`;
    pageEl.querySelector('[data-toggle-form]').addEventListener('click', () => renderLectures(!showForm));
    pageEl.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => go('lecture', b.dataset.open)));
    const form = pageEl.querySelector('[data-new]');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const err = form.querySelector('[data-err]'); err.textContent = '';
      const section = form.elements.section.value.trim();
      let lecture = form.elements.lecture.value.trim(), title = form.elements.title.value.trim();
      const m = title.match(/^(\d+)[.)]\s*(.*)$/); if (m && !lecture) { lecture = m[1]; title = m[2] || title; }
      const transcript = fixTranscript(form.elements.transcript.value.trim());
      if (!title || !transcript) { err.textContent = '제목과 대본을 채워 주세요.'; return; }
      const id = 'lec-' + Date.now().toString(36);
      const doc = { id, title, section, lecture, transcript, paragraphs: splitParagraphs(transcript), paragraphs_ko: [], summary: '', createdAt: new Date().toISOString() };
      try {
        await saveLecture(doc);
        if (!state.lectures.some(x => x.id === id)) state.lectures.push(doc);
        go('lecture', id);
        translateLecture(id);
      } catch (e2) { err.textContent = '저장에 실패했어요. ' + (e2?.message || e2?.code || ''); }
    });
  }

  function paraHtml(l) {
    return (l.paragraphs || []).map((p, i) => `<p class="para"><span class="en">${esc(p)}</span>${l.paragraphs_ko?.[i] ? `<span class="sub">${esc(l.paragraphs_ko[i])}</span>` : '<span class="sub" style="color:var(--ink-faint)">…</span>'}</p>`).join('');
  }
  function renderLecture() {
    const l = state.lectures.find(x => x.id === state.lectureId);
    if (!l) { pageEl.innerHTML = '<div class="washi purple"></div><div class="crumb"><button data-back>인강 듣기</button> › ?</div><p class="empty">그 강의를 찾을 수 없어요.</p>'; pageEl.querySelector('[data-back]').addEventListener('click', () => go('lectures')); return; }
    const [cls, lbl] = lectureStatus(l); const t = tasks[l.id];
    const running = t && !t.error && t.done < t.total;
    pageEl.innerHTML = `<div class="washi purple"></div>
      <div class="crumb"><button data-back>인강 듣기</button> › ${l.lecture ? esc(l.lecture) + '. ' : ''}${esc(l.title)}</div>
      <h1 class="title">${l.lecture ? esc(l.lecture) + '. ' : ''}${esc(l.title)}</h1>
      ${l.section ? `<div class="subtitle">${esc(l.section)}</div>` : ''}
      <div class="statusline">
        <span class="pill ${cls}">${lbl}</span>
        ${running ? `<span class="progress"><i style="width:${Math.round(t.done / t.total * 100)}%"></i></span>` : ''}
        ${!running && cls !== 'done' && state.sample ? '<button class="btn" data-translate>한국어 번역 만들기</button>' : ''}
        ${!running && cls === 'done' && state.sample ? '<button class="btn ghost" data-translate>다시 번역</button>' : ''}
        ${!state.sample && cls !== 'done' ? '<span class="hint" style="font-size:13px;color:var(--ink-faint)">번역은 python3 serve.py 로 열거나 claude.ai 에서 돼요.</span>' : ''}
        <button class="btn ghost" data-del style="color:var(--wrong);border-color:var(--wrong);margin-left:auto">삭제</button>
      </div>
      ${t?.error ? `<div class="err">${esc(t.error)}</div>` : ''}
      ${l.summary ? `<div class="summary"><span class="lbl">Summary</span>${bi(l.summary)}</div>` : ''}
      <div class="prose">${paraHtml(l)}</div>`;
    pageEl.querySelector('[data-back]').addEventListener('click', () => go('lectures'));
    pageEl.querySelector('[data-del]').addEventListener('click', async () => {
      if (!confirm('이 강의 대본과 번역을 지울까요?')) return;
      await deleteLecture(l.id); delete tasks[l.id]; taskBadge(); go('lectures');
    });
    const tb = pageEl.querySelector('[data-translate]');
    if (tb) tb.addEventListener('click', () => { if (cls === 'done') { l.paragraphs_ko = []; l.summary = ''; } translateLecture(l.id); });
  }
  function renderLectureBodyOnly(l) {
    const prose = pageEl.querySelector('.prose'); if (prose) prose.innerHTML = paraHtml(l);
    const t = tasks[l.id]; const bar = pageEl.querySelector('.progress i'); if (bar && t) bar.style.width = Math.round(t.done / t.total * 100) + '%';
    const pill = pageEl.querySelector('.statusline .pill'); if (pill) { const [c, lb] = lectureStatus(l); pill.className = 'pill ' + c; pill.textContent = lb; }
  }

  // ---------- global wiring ----------
  document.addEventListener('keydown', e => {
    if (state.view !== 'study' || e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowRight' && state.idx < book().length - 1) go('study', state.idx + 1);
    if (e.key === 'ArrowLeft' && state.idx > 0) go('study', state.idx - 1);
  });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    const v = t.dataset.view;
    if (v === 'cover') go('study', 0);
    else if (v === 'toc') go('study', 1);
    else if (v === 'study') go('study', Math.max(2, state.idx >= 2 ? state.idx : 2));
    else go(v);
  }));
  window.addEventListener('hashchange', () => { readHash(); render(); });

  readHash();
  connect();
})();
</script>
